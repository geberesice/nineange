    root.setAttribute('data-choosepet', '');

    var msg = document.createElement('p');
    msg.className = 'ng-confirm-text';
    msg.textContent = 'Who is fighting?';
    root.appendChild(msg);

    var row = document.createElement('div');
    row.className = 'ng-choosepet-row';
    root.appendChild(row);

    var done = false;
    function answer(pet) {
      if (done) return;
      done = true;
      if (root.parentNode) root.parentNode.removeChild(root);
      if (typeof pick === 'function') pick(pet || null);
    }

    for (var i = 0; i < pets.length; i++) {
      (function (pet) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ng-btn ng-choosepet';
        btn.setAttribute('data-choosepet-pick', '');
        try {
          var art = NG.pets.poseOf(pet, 'rest', 0);
          btn.appendChild(NG.sprites.toCanvas(art.rows, art.palette, 2));
        } catch (e) { /* the words below still say who this is */ }
        var name = document.createElement('span');

        btn.addEventListener('click', function () { answer(pet); });
        row.appendChild(btn);
      }(pets[i]));

    var back = NG.ui._button('Not now', 'data-choosepet-cancel',
      function () { answer(null); }, 'ng-btn-ghost ng-btn-util');
    root.appendChild(back);

    container.appendChild(root);

  confirm: function (container, question, handlers) {

    handlers = handlers || {};

    var root = document.createElement('div');
    root.className = 'ng-confirm';
    root.setAttribute('data-confirm', '');

    var msg = document.createElement('p');
    msg.className = 'ng-confirm-text';
    msg.textContent = question;
    root.appendChild(msg);

    var onKey = null;
    function close() {
      if (onKey) { window.removeEventListener('keydown', onKey); onKey = null; }
      if (root.parentNode) root.parentNode.removeChild(root);
    }
    var answered = false;
    function answer(which) {
      if (answered) return;
      answered = true;
      close();
      if (typeof handlers[which] === 'function') handlers[which]();
    }

    var row = document.createElement('div');
    row.className = 'ng-confirm-buttons';
    var yes = NG.ui._button('Yes', 'data-yes', function () { answer('yes'); }, 'ng-btn-primary');
    row.appendChild(yes);
    row.appendChild(NG.ui._button('No', 'data-no', function () { answer('no'); }, 'ng-btn-secondary'));
    root.appendChild(row);

    onKey = function (e) {
      if (e.key === 'Escape') { answer('no'); }
      else if (e.key === 'Enter' || e.key === 'y' || e.key === 'Y') { answer('yes'); }
    };
    window.addEventListener('keydown', onKey);

  conversation: function (container, convo, handlers) {

    var row = document.createElement('div');
    row.className = 'ng-convo-buttons';

      if (closed) return;
      closed = true;
      if (onKey) { window.removeEventListener('keydown', onKey); onKey = null; }
      if (root.parentNode) root.parentNode.removeChild(root);
      if (typeof handlers.close === 'function') handlers.close();
    }

    function advance() {
      NG.talk.advance(convo);
      if (NG.talk.isOver(convo)) close(); else render();
    }

    function pick(index) {
      if (typeof handlers.choose === 'function') handlers.choose(index);
      if (NG.talk.isOver(convo)) close(); else render();
    }

    var MAX_CHOICES = 9;

    function render() {
      var line = NG.talk.current(convo);
      who.textContent = line.speaker || '';
      said.textContent = line.text || '';
      row.innerHTML = '';
      var choices = line.choices, first = null, i;
      if (choices && choices.length) {
        for (i = 0; i < choices.length && i < MAX_CHOICES; i++) {
          (function (idx) {
            var btn = NG.ui._button((idx + 1) + '. ' + choices[idx].text, 'data-choice',
              function () { pick(idx); }, 'ng-btn-secondary');
            btn.setAttribute('data-choice', String(idx));
            row.appendChild(btn);
            if (!first) first = btn;
          })(i);
        }
      } else {
        first = NG.ui._button('Next', 'data-next', advance, 'ng-btn-primary');
        row.appendChild(first);
      }
      if (first && typeof first.focus === 'function') first.focus();
    }

    onKey = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      var choices = NG.talk.current(convo).choices;
      if (choices && choices.length) {
        var n = parseInt(e.key, 10);
        if (n >= 1 && n <= Math.min(MAX_CHOICES, choices.length)) {
          e.preventDefault();
          pick(n - 1);
        }
        return;
      }
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        advance();
      }
    };
    window.addEventListener('keydown', onKey);

    container.appendChild(root);
    render();
    return { close: close, refresh: render };
  },

  fight: function (container, state, handlers) {

    root.appendChild(message);

    buttons.className = 'ng-fight-buttons';
    root.appendChild(buttons);

    var onKey = null, closed = false;
    function close() {
      if (closed) return;
      closed = true;
      if (showTimer) { clearTimeout(showTimer); showTimer = null; }
      showing = null;
      if (onKey) { window.removeEventListener('keydown', onKey); onKey = null; }
      if (root.parentNode) root.parentNode.removeChild(root);
      if (typeof handlers.close === 'function') handlers.close();
    }

    function changed() {
      if (typeof handlers.change === 'function') handlers.change();
    }

    var SHOW = { LUNGE: 220, HURT: 320, TOTAL: 620, TICK: 55 };
    var showing = null;
    var showTimer = null;

    function stillShowing() {
      if (!showing) return false;
      return (Date.now() - showing.start) < SHOW.TOTAL * showing.steps.length;
    }

    function stepNow() {
      if (!showing) return null;
      var t = Date.now() - showing.start;
      var i = Math.floor(t / SHOW.TOTAL);
      if (i < 0 || i >= showing.steps.length) return null;
      return { step: showing.steps[i], t: t - i * SHOW.TOTAL };
    }

    function clipFor(move) {
      if (move === 'attack') return 'attack';
      if (move === 'defend') return 'guard';
      return 'idle';
    }

    function effectFor(move, actor) {
      if (move === 'defend') return 'shield';
      if (move === 'feed') return 'heal';
      if (move !== 'attack') return null;
      if (actor && actor.effect_id) return actor.effect_id;
      return 'impact';

    function foeActor() { return NG.animation.actor('robin'); }

    function beginShow(turn) {
      if (NG.ui.reducedMotion()) {
        showing = null;
        drawArena();
        return;
      }
      var steps = (turn && turn.steps && turn.steps.length) ? turn.steps : null;
      if (!steps) { showing = null; drawArena(); return; }
      showing = { start: Date.now(), steps: steps };
      tickShow();
    }

    function tickShow() {
      if (showTimer) { clearTimeout(showTimer); showTimer = null; }
      if (closed) return;
      drawArena();
      if (stillShowing()) {
        showTimer = setTimeout(tickShow, SHOW.TICK);
      } else {
        showing = null;
        if (!closed) drawArena();
      }
    }

    function posed(side, clip, at) {
      if (side === 'pet') {
        var p = NG.pets.poseOf(fight.pet, clip, at);
        return { rows: p.rows, palette: p.palette };
      }
      if (fight.foe && fight.foe.species) {
        var sp = NG.pets.poseOf({ species: fight.foe.species }, clip, at);
        return { rows: sp.rows, palette: sp.palette };
      }
      var actor = foeActor();
      if (actor) {
        var f = NG.animation.sample(actor, clip, at);
        if (f) return { rows: f.rows, palette: f.palette };
      }
      return { rows: NG.sprites.ROBIN, palette: NG.sprites.robinPalette() };
    }

    function poseNow(side) {
      var now = stepNow();
      if (!now) return posed(side, 'rest', 0);

      var step = now.step, t = now.t;
      if (step.who === side) {
        return posed(side, clipFor(step.move), t);
      }
      if (step.damage > 0 && t >= SHOW.LUNGE) {
        return posed(side, 'hurt', t - SHOW.LUNGE);
      }
      return posed(side, 'rest', 0);
    }

    function effectNow(side) {
      var now = stepNow();
      if (!now) return null;
      var step = now.step, t = now.t;
      if (t < 100 || t > SHOW.LUNGE + SHOW.HURT) return null;

      var actor = (step.who === 'pet') ? petActor() : foeActor();
      var id = null;
      if (step.move === 'attack') {
        if (step.who !== side) id = effectFor('attack', actor);
      } else if (step.who === side) {
        id = effectFor(step.move, actor);
      }
      if (!id) return null;
      var fx = NG.animation.effect(id);
      if (!fx) return null;
      return NG.animation.sample(fx, 'play', t - 100);
    }


    function corner(who, rows, palette, name, hp, maxHp, atk, def) {

      var box = document.createElement('div');
      box.className = 'ng-fight-side';
      box.setAttribute('data-fight-side', who);

      var pic = document.createElement('div');
      pic.className = 'ng-fight-pic';
      try {
        pic.appendChild(NG.sprites.toCanvas(rows, palette, SPRITE_SCALE));
      } catch (e) { pic.textContent = '?'; }
      var fx = effectNow(who);
      if (fx) {
        try {
          var fxc = NG.sprites.toCanvas(fx.rows, fx.palette, SPRITE_SCALE);
          fxc.className = 'ng-fight-fx';
          pic.appendChild(fxc);
        } catch (e2) { /* a flash that will not draw is not worth a fight */ }
      }
      box.appendChild(pic);

      var label = document.createElement('div');
      label.className = 'ng-fight-name';
      label.textContent = name;
      box.appendChild(label);

      var bar = NG.ui._bar('HP', hp, maxHp);
      bar.setAttribute('data-fight-hp', who);
      box.appendChild(bar);

      var line = document.createElement('div');
      line.className = 'ng-fight-stats';
      line.setAttribute('data-fight-stats', who);
      line.textContent = 'ATK ' + atk + '   DEF ' + def;
      box.appendChild(line);
      return box;
    }

    function drawArena() {
      arena.innerHTML = '';
      var art = poseNow('pet');
      arena.appendChild(corner('pet', art.rows, art.palette,
        NG.pets.nameOfCap(fight.pet),
        fight.pet.hp, NG.stats.maxOf(fight.pet, 'hp'),
        NG.fight.petAtk(fight), NG.fight.petDef(fight)));

      var vs = document.createElement('div');
      vs.className = 'ng-fight-vs';
      vs.textContent = 'vs';
      arena.appendChild(vs);

      var foeArt = poseNow('foe');
      arena.appendChild(corner('foe', foeArt.rows, foeArt.palette,
        fight.foe.name, fight.foe.hp, fight.foe.maxHp,
        NG.fight.foeAtk(fight), NG.fight.foeDef(fight)));
    }


    function moveWord(m) {
      if (m === 'defend') return 'guarded';
      if (m === 'feed') return 'ate';
      return 'attacked';
    }

    function foeCap() {
      var n = fight.foe.name || 'it';
      return n.charAt(0).toUpperCase() + n.slice(1);
    }

    function tellTurn(turn) {
      var bits = [];
      if (turn.fed) {
        bits.push('You gave ' + (turn.fedName || 'some food') + ' -- ' +
                  turn.healed + ' health back.');
      }
      if (turn.foeHealed > 0) {
        bits.push(foeCap() + (fight.friendly ? ' took a breather and got '
                                             : ' pecked at something and got ') +
                  turn.foeHealed + ' back.');
      }
      if (turn.countered > 0) {
        bits.push('You guarded, and hit back for ' + turn.countered + '.');
      } else if (turn.toFoe > 0) {
        bits.push('You hit for ' + turn.toFoe + '.');
      }
      if (turn.foeCountered > 0) {
        bits.push(foeCap() + ' guarded, and hit back for ' + turn.foeCountered + '.');
      } else if (turn.toPet > 0) {
        bits.push('You took ' + turn.toPet + '.');
      }
      if (!turn.toFoe && !turn.toPet && !turn.fed && !turn.foeHealed) {
        bits.push('You both ' + moveWord(turn.mine) + '. Nothing got through.');
      }
      if (turn.won) {
        if (fight.friendly) {
          bits.push(foeCap() + ' has had enough. You win!');
          if (turn.coins > 0) {
            bits.push('That is ' + turn.coins + ' coins for winning the contest.');
          }
        } else {
          bits.push(foeCap() + ' has had enough and flies off. You win!');
          if (turn.coins > 0) {
            bits.push('You found ' + turn.coins + ' coins where it had been.');
          }
        }
      } else if (turn.lost) {
        if (fight.friendly) {
          bits.push(NG.pets.nameOfCap(fight.pet) +
                    ' has had enough. ' + foeCap() + ' wins this one.');
        } else {
          bits.push(NG.pets.nameOfCap(fight.pet) + ' has fainted. Take it to the vet.');
        }
      }
      message.textContent = bits.join(' ');
    }


    function press(move) {
      if (fight.over) return;
      if (stillShowing()) return;
      var turn = NG.game.fightMove(state, move);
      if (!turn) {
        message.textContent = NG.fight.whyNotFeed(state, fight) || 'That did not work.';
        drawButtons();
        return;
      }
      tellTurn(turn);
      beginShow(turn);
      drawButtons();
      changed();
    }

    function drawButtons() {
      buttons.innerHTML = '';
      if (fight.over) {
        var done = NG.ui._button(fight.won ? 'Well done' : 'Oh no',
          'data-fight-close', function () { close(); }, 'ng-btn-primary ng-btn-util');
        buttons.appendChild(done);
        if (typeof done.focus === 'function') done.focus();
        return;
      }
      buttons.appendChild(NG.ui._button('Attack', 'data-fight-attack',
        function () { press('attack'); }, 'ng-btn-primary ng-btn-util'));
      buttons.appendChild(NG.ui._button('Defend', 'data-fight-defend',
        function () { press('defend'); }, 'ng-btn-secondary ng-btn-util'));

      var food = NG.fight.foodFor(state);
      var feed = NG.ui._button(food ? ('Feed: ' + food.name) : 'Feed', 'data-fight-feed',
        function () { press('feed'); }, 'ng-btn-secondary ng-btn-util');
      if (!food) {
        feed.disabled = true;
        feed.className += ' ng-btn-off';
      }
      buttons.appendChild(feed);

      var why = document.createElement('div');
      why.className = 'ng-fight-why';
      why.setAttribute('data-fight-why', '');
      why.textContent = food ? '' : (NG.fight.whyNotFeed(state, fight) || '');
      buttons.appendChild(why);
    }

    onKey = function (e) {
      if (e.key === 'Escape' && fight && fight.over) { e.preventDefault(); close(); }
    };
    window.addEventListener('keydown', onKey);

    container.appendChild(root);

    if (!fight || !fight.pet) {
      title.textContent = 'No fight';
      message.textContent = 'There is nothing here to fight.';
      buttons.appendChild(NG.ui._button('Close', 'data-fight-close',
        function () { close(); }, 'ng-btn-primary ng-btn-util'));
      return { close: close, refresh: function () {} };
    }

    title.textContent = NG.pets.nameOfCap(fight.pet) + ' meets ' + fight.foe.name;
    message.textContent = 'Choose what to do.';
    drawArena();
    drawButtons();
    if (typeof root.focus === 'function') root.focus();
    return { close: close, refresh: function () { drawArena(); drawButtons(); } };
  }
};

/* ---- src/game.js ---- */
NG.game = {
  startingClock: function () {
    var clock = NG.clock.create();
    NG.clock.advance(clock, (NG.C.START_HOUR - NG.C.DAY_START_H) * 60);
    return clock;
  },

  buildMaps: function (world) {
    NG.travel.reset();
    NG.travel.register(world);
    var town = NG.town.build();
    NG.travel.register(town);
    NG.interiors.buildAll(town);
    if (NG.walkhome) NG.walkhome.reset();
    return world;
  },

  newState: function (choice) {
    var world = NG.game.buildMaps(NG.world.generate(NG.C.SEED));
    var human = NG.stats.create('human');
    human.shape = choice.shape;
    human.palette = choice.palette;
    human.name = choice.name || 'You';
    human.x = world.spawn.x;
    human.y = world.spawn.y;
    human.facing = 'down';
    var clock = NG.game.startingClock();
    NG.npcs.useClock(clock);
    return {
      version: NG.C.SAVE_VERSION,
      world: world, human: human, party: [], eggs: [],
      clock: clock, score: NG.score.create(),
      coins: 0, berries: 0, steps: 0,
      bag: NG.bag.create(), worn: NG.worn.create(),
      job: null,
      met: {},
      beaten: {},
      convo: null,
      shop: null,
      fight: null,
      trail: [{ x: world.spawn.x, y: world.spawn.y }],
      visited: {}, transition: null,
      screenSize: (typeof window !== 'undefined' && window)
        ? NG.bestScreenSize(window.innerWidth, window.innerHeight)
        : NG.C.DEFAULT_SCREEN_SIZE,
      gameOver: false, events: []
    };
  },

  takeStep: function (state, dx, dy) {
    if (state.gameOver) return state;
    if (NG.travel.isBusy(state)) return state;
    if (state.asking) return state;
    if (state.convo) return state;
    if (state.shop) return state;
    if (state.bagOpen) return state;
    if (state.fight) return state;

    var turned = NG.game.facingFrom(dx, dy);
    if (turned) state.human.facing = turned;

    var next = NG.grid.step(state.world, state.human, dx, dy);
    if (next.x === state.human.x && next.y === state.human.y) return state;
    if (!NG.world.isWalkable(state.world, next.x, next.y)) {
      NG.game.useThing(state, NG.game.thingAt(state, next.x, next.y));
      return state;
    }

    state.human.x = next.x;
    state.human.y = next.y;
    state.steps += 1;

    state.trail.unshift({ x: next.x, y: next.y });
    if (state.trail.length > NG.C.PARTY_MAX + 2) state.trail.pop();
    NG.creature.updateFollow(state.party, state.trail);

    var here = { x: next.x, y: next.y };

    var passing = NG.npcs.walkerAt(state.clock, state.world.id, here.x, here.y);
    if (passing) NG.game.say(state, NG.walkhome.lineFor(state.clock, passing));

    if (NG.actions.collectCoin(state.world, here)) {
      state.coins += 1;
      NG.score.award(state.score, 'coin');
      state.events.push({ type: 'coin' });
    }

    if (!state.eggs) state.eggs = [];
    var lying = state.world.eggs || [];
    var ei;
    for (ei = 0; ei < lying.length; ei++) {
      var onTheGround = lying[ei];
      if (!onTheGround || onTheGround.taken) continue;
      if (onTheGround.x !== here.x || onTheGround.y !== here.y) continue;
      onTheGround.taken = true;
      var carried = NG.creature.createEgg();
      if (onTheGround.species) carried.species = NG.pets.speciesOf(onTheGround).id;
      state.eggs.push(carried);
      state.events.push({ type: 'eggfound' });
    }

    var stillCarried = [];
    for (ei = 0; ei < state.eggs.length; ei++) {
      var carried = state.eggs[ei];
      NG.creature.stepEgg(carried);
      if (!carried.ready || state.party.length >= NG.C.PARTY_MAX) {
        stillCarried.push(carried);
        continue;
      }
      var pet = NG.creature.hatch(carried);
      pet.x = state.human.x; pet.y = state.human.y;
      state.party.push(pet);
      NG.score.award(state.score, 'hatch');
      state.events.push({ type: 'hatch', kind: NG.pets.kindOf(pet),
                          name: NG.pets.nameOf(pet), pet: pet });
    }
    state.eggs = stillCarried;

    if (NG.score.visitRegion(state.score, state.world, here.x, here.y)) {
      state.events.push({ type: 'region' });
    }

    NG.creature.onStep(state.party, state.steps);
    this.checkTitle(state);

    NG.game.meetRobin(state, here.x, here.y);

    var door = NG.travel.doorAt(state.world, here.x, here.y);
    if (door) NG.game.enterDoor(state, door);
    return state;
  },

  enterDoor: function (state, door) {
    if (!door) return false;
    if (typeof door.toX !== 'number' || !isFinite(door.toX)) return false;
    if (typeof door.toY !== 'number' || !isFinite(door.toY)) return false;

    var isCrossing = (state.world.id === 'forest' && door.to === 'town') ||
      (state.world.id === 'town' && door.to === 'forest');
    if (isCrossing && state.ui && typeof state.ui.ask === 'function') {
      state.asking = true;
      state.ui.ask(door.to === 'town'
        ? 'Cross the bridge to Starter Town?'
        : 'Go back to the forest?',
        function () {
          state.asking = false;
          NG.travel.begin(state, door.to, { x: door.toX, y: door.toY });
        },
        function () { state.asking = false; });
      return true;
    }
    return NG.travel.begin(state, door.to, { x: door.toX, y: door.toY });
  },

  enterBed: function (state, prop) {
    if (!prop || prop.kind !== 'bed') return false;
    if (state.ui && typeof state.ui.ask === 'function') {
      state.asking = true;
      state.ui.ask('Sleep until morning? (' + NG.C.INN_BED_COST + ' coins)',
        function () {
          state.asking = false;
          NG.game.askToSleep(state);
        },
        function () { state.asking = false; });
      return true;
    }
    NG.game.askToSleep(state);
    return true;
  },

  thingAt: function (state, x, y) {
    if (!state || !state.world) return null;
    var mapId = state.world.id;
    var person = NG.npcs.atSpot(state.clock, mapId, x, y);
    if (person) return { kind: 'person', who: person };
    var walker = NG.npcs.walkerAt(state.clock, mapId, x, y);
    if (walker) return { kind: 'walker', who: walker };
    var words = NG.game.signTextAt(state.world, x, y);
    if (words) return { kind: 'sign', text: words };
    var prop = NG.town.propAt(state.world, x, y);
    if (prop && prop.kind === 'bed' && mapId === 'inn') return { kind: 'bed', prop: prop };
    return null;
  },

  signTextAt: function (map, x, y) {
    if (!map) return null;
    var sp = map.signpost;
    if (sp && sp.x === x && sp.y === y && typeof sp.text === 'string' && sp.text) {
      return sp.text;
    }
    var prop = NG.town.propAt(map, x, y);
    if (prop && typeof prop.text === 'string' && prop.text) return prop.text;
    return null;
  },

  useThing: function (state, thing) {
    if (!state || !thing) return false;
    if (thing.kind === 'person') return NG.game.talkTo(state, thing.who.id);
    if (thing.kind === 'walker') {
      return NG.game.say(state, NG.walkhome.lineFor(state.clock, thing.who));
    }
    if (thing.kind === 'sign') return NG.game.say(state, thing.text);
    if (thing.kind === 'bed') return NG.game.enterBed(state, thing.prop);
    return false;
  },

  FACING: {
    up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 },
    left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 }
  },

  INTERACT_ORDER: [
    { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }
  ],

  facingFrom: function (dx, dy) {
    if (dx > 0) return 'right';
    if (dx < 0) return 'left';
    if (dy > 0) return 'down';
    if (dy < 0) return 'up';
    return null;
  },

  readFacing: function (value) {
    return Object.prototype.hasOwnProperty.call(NG.game.FACING, value) ? value : 'down';
  },

  interact: function (state) {
    if (!state || state.gameOver) return false;
    if (NG.travel.isBusy(state)) return false;
    if (state.asking) return false;
    if (state.convo) return false;
    if (state.shop) return false;
    if (state.bagOpen) return false;
    if (state.fight) return false;
    if (!state.human) return false;

    var first = NG.game.FACING[NG.game.readFacing(state.human.facing)];
    var tries = [first];
    for (var i = 0; i < NG.game.INTERACT_ORDER.length; i++) {
      var d = NG.game.INTERACT_ORDER[i];
      if (d.dx !== first.dx || d.dy !== first.dy) tries.push(d);
    }
    for (var t = 0; t < tries.length; t++) {
      var found = NG.game.thingAt(state, state.human.x + tries[t].dx,
                                         state.human.y + tries[t].dy);
      if (found) { NG.game.useThing(state, found); return true; }
    }
    var under = NG.game.thingAt(state, state.human.x, state.human.y);
    if (under) { NG.game.useThing(state, under); return true; }

    NG.game.say(state, 'There is nothing here.');
    return true;
  },

  talkTo: function (state, npcId) {
    if (!state || state.gameOver) return false;
    if (state.convo) return false;
    var convo = NG.talk.begin(state, npcId);
    if (!convo) return false;
    state.convo = convo;
    if (state.ui && typeof state.ui.talk === 'function') {
      state.ui.talk(convo, function () { NG.game.endTalk(state); });
    }
    return true;
  },

  askForName: function (state, app, pet) {
    if (!state || !pet || !app) return false;
    state.asking = true;
    try {
      NG.ui.namePet(app, pet, function (chosen) {
        state.asking = false;
        NG.game.renamePet(state, pet, chosen);
      });
    } catch (e) {
      state.asking = false;
      return false;
    }
    return true;
  },

  renamePet: function (state, pet, chosen) {
    if (!pet) return false;
    if (typeof chosen !== 'string') return false;
    var name = chosen.replace(/^\s+|\s+$/g, '');
    if (!name) return false;
    if (name.length > 18) name = name.slice(0, 18);
    pet.name = name;
    return true;
  },


  endTalk: function (state) {
    if (!state || !state.convo) return false;
    var who = NG.npcs.get(state.convo.npcId);
    NG.talk.finish(state.convo);
    state.convo = null;
    NG.game.offerContest(state, who);
    return true;
  },

  offerContest: function (state, who) {
    if (!state || state.gameOver || !who) return false;
    if (state.fight || state.convo || state.shop || state.bagOpen) return false;
    var foe = NG.fight.friendlyFoeFor(who);
    if (!foe) return false;
    var able = NG.game.fightingPets(state);
    if (!able.length) return false;
    if (!state.ui || typeof state.ui.ask !== 'function') return false;

    state.asking = true;
    state.ui.ask('Have a friendly contest with ' + who.name + '?',
      function () {
        var pets = NG.game.fightingPets(state);
        if (pets.length > 1 && typeof state.ui.choosePet === 'function') {
          state.ui.choosePet(pets, function (picked) {
            state.asking = false;
            if (picked) NG.game.openContest(state, foe, picked);
          });
          return;
        }
        state.asking = false;
        NG.game.openContest(state, foe, pets.length ? pets[0] : null);
      },
      function () { state.asking = false; });
    return true;
  },

  openContest: function (state, foe, pet) {
    if (!state || state.gameOver || !foe || !pet) return false;
    if (state.fight) return false;
    var fight = NG.fight.begin(pet, null,
      { foe: foe, friendly: true, worn: state.worn });
    if (!fight) return false;
    fight.spot = null;
    state.fight = fight;
    if (state.ui && typeof state.ui.fight === 'function') {
      state.ui.fight(function () { NG.game.closeFight(state); });
    }
    return true;
  },

  chooseInTalk: function (state, index) {
    if (!state || !state.convo) return null;
    var result = NG.talk.choose(state, state.convo, index);
    if (NG.talk.isOver(state.convo)) NG.game.endTalk(state);
    if (!result) return result;
    if (result.kind === 'openShop') NG.game.openShop(state, result.stall);
    else if (result.kind === 'offerJob') NG.game.askForJob(state, result.from);
    else if (result.kind === 'handInJob') NG.game.handInJob(state, result.to);
    else if (result.kind === 'heal') NG.game.healAtVet(state);
    else if (result.kind === 'revive') NG.game.reviveAtVet(state);
    else if (result.kind === 'sleep') NG.game.askToSleep(state);
    return result;
  },

  say: function (state, text) {
    if (!state || typeof text !== 'string' || !text) return false;
    if (!state.events) state.events = [];
    state.events.push({ type: 'say', text: text });
    return true;
  },

  askForJob: function (state, npcId) {
    if (!state || state.gameOver) return false;
    var offer = NG.jobs.offer(state, npcId);
    if (offer.refusedBecause) {
      NG.game.say(state, offer.refusedBecause);
      return false;
    }
    var said = NG.jobs.describe(offer);
    if (state.ui && typeof state.ui.ask === 'function') {
      state.asking = true;
      state.ui.ask(said + ' Take it on?',
        function () {
          state.asking = false;
          if (NG.jobs.accept(state, offer)) NG.game.say(state, said);
        },
        function () { state.asking = false; });
      return true;
    }
    if (!NG.jobs.accept(state, offer)) return false;
    NG.game.say(state, said);
    return true;
  },

  handInJob: function (state, npcId) {
    if (!state || state.gameOver) return false;
    var job = NG.jobs.current(state);
    if (!job) {
      NG.game.say(state, 'You have no errand on just now. Ask, and I will find you one.');
      return false;
    }
    if (!NG.jobs.isDoneBy(state, npcId)) {
      if (job.kind === 'fetch' && job.from === npcId) {
        NG.game.say(state, 'Not yet. ' + NG.jobs.describe(job));
      } else {
        NG.game.say(state, 'That one is not mine to take. ' + NG.jobs.describe(job));
      }
      return false;
    }
    var pay = NG.jobs.payOf(job);
    if (!NG.jobs.handIn(state, npcId)) return false;
    NG.game.say(state, 'That is that. Here is your ' + pay + ' coins.');
    return true;
  },

  vetSlot: function (list, state) {
    if (list.length) return list[0];
    return (state && state.party && state.party.length) ? 0 : -1;
  },

  petName: function (pet) {
    return NG.pets.nameOf(pet);
  },

  healAtVet: function (state) {
    if (!state) return false;
    var slot = NG.game.vetSlot(NG.game.hurtPets(state), state);
    var why = NG.game.whyNotHeal(state, slot);
    if (why !== null) { NG.game.say(state, why); return false; }
    var name = NG.game.petName(NG.game.petAt(state, slot));
    if (!NG.game.vetHeal(state, slot)) return false;
    NG.game.say(state, 'Let me see to ' + name + '. There -- right as rain.');
    return true;
  },

  reviveAtVet: function (state) {
    if (!state) return false;
    var slot = NG.game.vetSlot(NG.game.lostPets(state), state);
    var why = NG.game.whyNotRevive(state, slot);
    if (why !== null) { NG.game.say(state, why); return false; }
    var name = NG.game.petName(NG.game.petAt(state, slot));
    if (!NG.game.vetRevive(state, slot)) return false;
    state.events.push({ type: 'revived', name: name });
    return true;
  },

  openShop: function (state, stall) {
    if (!state || state.gameOver) return false;
    if (state.shop) return false;
    if (typeof stall !== 'string' || !stall) return false;
    if (!NG.shop.isOpen(state, stall)) return false;
    state.shop = { stall: stall };
    if (state.ui && typeof state.ui.shop === 'function') {
      state.ui.shop(stall, function () { NG.game.closeShop(state); });
    }
    return true;
  },

  closeShop: function (state) {
    if (!state || !state.shop) return false;
    state.shop = null;
    return true;
  },

  openBag: function (state) {
    if (!state || state.gameOver) return false;
    if (state.bagOpen) return false;
    if (state.convo || state.shop) return false;
    state.bagOpen = true;
    if (state.ui && typeof state.ui.bag === 'function') {
      state.ui.bag(function () { NG.game.closeBag(state); });
    }
    return true;
  },

  closeBag: function (state) {
    if (!state || !state.bagOpen) return false;
    state.bagOpen = false;
    return true;
  },


  fightingPets: function (state) {
    var party = (state && state.party) ? state.party : [];
    var able = [];
    for (var i = 0; i < party.length; i++) {
      var pet = party[i];
      if (!pet || NG.creature.isLost(pet)) continue;
      if (!(pet.hp > 0)) continue;
      able.push(pet);
    }
    return able;
  },

  fightingPet: function (state) {
    var able = NG.game.fightingPets(state);
    return able.length ? able[0] : null;
  },

  meetRobin: function (state, x, y) {
    if (!state || state.gameOver || !state.world) return false;
    var spot = NG.fight.robinAt(state.world, x, y);
    if (!spot) return false;
    var pet = NG.game.fightingPet(state);
    if (!pet) {
      NG.game.say(state, 'A robin hops onto the path. You have no pet to fight it ' +
                         'with, and you are not taking on a bird by yourself.');
      return false;
    }
    if (state.ui && typeof state.ui.ask === 'function') {
      state.asking = true;
      state.ui.ask('Fight the robin?',
        function () {
          var able = NG.game.fightingPets(state);
          if (able.length > 1 && typeof state.ui.choosePet === 'function') {
            state.ui.choosePet(able, function (picked) {
              state.asking = false;
              if (picked) NG.game.openFight(state, 'robin', spot, picked);
            });
            return;
          }
          state.asking = false;
          NG.game.openFight(state, 'robin', spot);
        },
        function () { state.asking = false; });
      return true;
    }
    return NG.game.openFight(state, 'robin', spot);
  },

  openFight: function (state, opponentId, spot, chosen) {
    if (!state || state.gameOver) return false;
    if (state.fight) return false;
    if (state.convo || state.shop || state.bagOpen) return false;
    var able = NG.game.fightingPets(state), pet = null, i;
    if (chosen) {
      for (i = 0; i < able.length; i++) if (able[i] === chosen) pet = chosen;
    }
    if (!pet) pet = able.length ? able[0] : null;
    if (!pet) return false;
    var fight = NG.fight.begin(pet, opponentId, { worn: state.worn });
    if (!fight) return false;
    fight.spot = spot || null;
    state.fight = fight;
    if (state.ui && typeof state.ui.fight === 'function') {
      state.ui.fight(function () { NG.game.closeFight(state); });
    }
    return true;
  },

  fightMove: function (state, move) {
    if (!state || !state.fight) return null;
    var fight = state.fight;
    var turn = NG.fight.take(state, fight, move);
    if (!turn) return null;
    if (fight.over && fight.won && fight.spot && !fight.spot.permanent) {
      fight.spot.beaten = true;
    }
    return turn;
  },

  closeFight: function (state) {
    if (!state || !state.fight) return false;
    state.fight = null;
    return true;
  },

  foodInBag: function (state) {
    if (!state) return null;
    var carried = NG.bag.list(state.bag), best = null, bestAmount = 0;
    for (var i = 0; i < carried.length; i++) {
      var it = NG.items.get(carried[i].id);
      var e = it ? it.effect : null;
      if (!e || e.kind !== 'restore' || e.bar !== 'hunger') continue;
      if (e.who === 'pet') continue;
      if (best === null || e.amount < bestAmount) {
        best = carried[i].id;
        bestAmount = e.amount;
      }
    }
    return best;
  },

  askToSleep: function (state) {
    if (!state) return { slept: false, text: '', job: null };
    if (state.gameOver) return { slept: false, text: 'The run is over.', job: null };
    if (NG.shop.coinsOf(state) >= NG.C.INN_BED_COST) {
      NG.game.sleep(state);
      return { slept: true, text: 'You slept until morning.', job: null };
    }

    var job = NG.jobs.current(state);
    if (!job) {
      var offered = NG.jobs.offer(state, 'innkeeper');
      if (!offered.refusedBecause) job = offered;
    }
    var text = 'A bed is ' + NG.C.INN_BED_COST + ' coins and you have ' +
      NG.shop.coinsOf(state) + '. ';
    text += job
      ? ('No matter -- there is work. ' + NG.jobs.describe(job) +
         ' Ask me for it and you will sleep tonight.')
      : 'Ask me for work and you will sleep tonight.';
    NG.game.say(state, text);
    return { slept: false, text: text, job: job };
  },

  sleep: function (state) {
    if (state.gameOver) return state;
    if (NG.shop.coinsOf(state) < NG.C.INN_BED_COST) return state;
    state.coins = NG.shop.coinsOf(state) - NG.C.INN_BED_COST;
    var target = NG.C.START_HOUR * 60;
    var now = state.clock.minutes;
    var minutes = (target > now) ? (target - now)
                                 : (NG.clock.MINUTES_PER_DAY - now + target);
    NG.clock.advance(state.clock, minutes);

    var restore = NG.C.INTERIOR.INN_SLEEP_RESTORE;
    var sleepers = [state.human].concat(NG.game.livingParty(state.party));
    for (var i = 0; i < sleepers.length; i++) {
      NG.stats.restore(sleepers[i], 'hunger', restore);
      NG.stats.restore(sleepers[i], 'thirst', restore);
      NG.stats.restore(sleepers[i], 'fun', restore);
    }
    state.events.push({ type: 'slept' });
    return state;
  },

  checkTitle: function (state) {
    var t = NG.score.refreshTitle(state.score);
    if (t) state.events.push({ type: 'title', name: t });
  },

  livingParty: function (party) {
    var alive = [];
    for (var i = 0; i < party.length; i++) {
      if (!party[i].lost) alive.push(party[i]);
    }
    return alive;
  },


  petAt: function (state, petIndex) {
    if (!state || !state.party) return null;
    if (typeof petIndex !== 'number') return null;
    if (!(petIndex >= 0) || petIndex >= state.party.length) return null;
    return state.party[petIndex] || null;
  },

  isHurt: function (pet) {
    if (!pet) return false;
    return !(pet.hp >= NG.stats.maxOf(pet, 'hp'));
  },

  hurtPets: function (state) {
    var out = [];
    var party = (state && state.party) ? state.party : [];
    for (var i = 0; i < party.length; i++) {
      if (party[i] && !NG.creature.isLost(party[i]) && NG.game.isHurt(party[i])) out.push(i);
    }
    return out;
  },

  lostPets: function (state) {
    var out = [];
    var party = (state && state.party) ? state.party : [];
    for (var i = 0; i < party.length; i++) {
      if (party[i] && NG.creature.isLost(party[i])) out.push(i);
    }
    return out;
  },

  whyNotHeal: function (state, petIndex) {
    if (!state || state.gameOver) return 'The surgery is shut.';
    var pet = NG.game.petAt(state, petIndex);
    if (!pet) return 'I cannot see a pet there.';
    if (NG.creature.isLost(pet)) {
      return 'That one is lost. Mending will not bring it back -- that is ' +
        NG.C.VET.REVIVE_COST + ' coins.';
    }
    if (!NG.game.isHurt(pet)) return 'There is nothing wrong with this one. Keep your coins.';
    if (NG.shop.coinsOf(state) < NG.C.VET.HEAL_COST) {
      return 'Mending costs ' + NG.C.VET.HEAL_COST + ' coins. Come back when you have them.';
    }
    return null;
  },

  whyNotRevive: function (state, petIndex) {
    if (!state || state.gameOver) return 'The surgery is shut.';
    var pet = NG.game.petAt(state, petIndex);
    if (!pet) return 'I cannot see a pet there.';
    if (!NG.creature.isLost(pet)) return 'This one is still with you. There is nothing to bring back.';
    if (NG.shop.coinsOf(state) < NG.C.VET.REVIVE_COST) {
      return 'Bringing one back costs ' + NG.C.VET.REVIVE_COST +
        ' coins. It is a lot, and it is worth it.';
    }
    return null;
  },

  canHeal: function (state, petIndex) {
    return NG.game.whyNotHeal(state, petIndex) === null;
  },

  canRevive: function (state, petIndex) {
    return NG.game.whyNotRevive(state, petIndex) === null;
  },

  vetHeal: function (state, petIndex) {
    if (!NG.game.canHeal(state, petIndex)) return false;
    NG.creature.mend(NG.game.petAt(state, petIndex));
    state.coins = NG.shop.coinsOf(state) - NG.C.VET.HEAL_COST;
    return true;
  },

  vetRevive: function (state, petIndex) {
    if (!NG.game.canRevive(state, petIndex)) return false;
    NG.creature.mend(NG.game.petAt(state, petIndex));
    state.coins = NG.shop.coinsOf(state) - NG.C.VET.REVIVE_COST;
    return true;
  },

  tick: function (state, gameMinutes) {
    NG.npcs.useClock(state.clock);
    NG.ambient.tick(state, gameMinutes);
    if (state.gameOver) return state;
    var dayBefore = state.clock.day;
    NG.clock.advance(state.clock, gameMinutes);

    var humanWasAlreadyAtZero = state.human.hp <= 0;
    NG.stats.drain(state.human, gameMinutes, NG.worn.drainMods(state.worn));
    var i, pet;
    for (i = 0; i < state.party.length; i++) {
      pet = state.party[i];
      if (pet.lost) continue;
      if (pet.hunger === 0 || pet.thirst === 0 || pet.fun === 0) pet.cleanDay = false;
      NG.stats.drain(pet, gameMinutes, NG.worn.drainMods(pet.worn));
    }

    if (state.clock.day > dayBefore) {
      var days = state.clock.day - dayBefore;
      for (var d = 0; d < days; d++) {
        NG.score.award(state.score, 'day');
        for (i = 0; i < state.party.length; i++) {
          pet = state.party[i];
          if (pet.lost) continue;
          var before = NG.pets.ageOf(pet);
          NG.creature.tickDay(pet);
          if (NG.creature.milestoneReached(pet, before)) {
            NG.score.award(state.score, 'milestone');
            state.events.push({ type: 'milestone', age: pet.age });
          }
        }
      }
      var maps = NG.travel.all();
      if (maps.indexOf(state.world) === -1) maps.push(state.world);
      for (var m = 0; m < maps.length; m++) {
        NG.actions.regrowBushes(maps[m], state.clock.day);
      }
    }

    if (humanWasAlreadyAtZero || state.human.hp <= 0) {
      state.gameOver = true;
      state.events.push({ type: 'gameover' });
    }

    this.checkTitle(state);
    return state;
  },

  start: function () {
    var app = document.getElementById('app');
    app.innerHTML = '';

    var saved = null;
    try { saved = NG.save.read(NG.save.getStorage()); }
    catch (e) { saved = null; }

    var onResume = saved ? function () {
      try {
        NG.game.begin(app, saved);
        NG.ui.toast(app, 'Save loaded!');
      } catch (err) {
        NG.ui.toast(app, 'That save could not be opened: ' + err.message);
        if (window.console && console.error) console.error('Nineange resume error:', err);
      }
    } : null;

    NG.ui.characterCreator(app, function (choice) {
      try {
        NG.game.begin(app, NG.game.newState(choice));
      } catch (err) {
        NG.ui.toast(app, 'The forest could not be built: ' + err.message);
        if (window.console && console.error) console.error('Nineange start error:', err);
      }
    }, onResume);
  },

  _teardown: [],

  stopCurrentGame: function () {
    while (NG.game._teardown.length) {
      var off = NG.game._teardown.pop();
      try { off(); } catch (e) { /* a half-torn-down game must not block a new one */ }
    }
  },

  begin: function (app, state) {
    NG.game.stopCurrentGame();
    app.innerHTML = '';
    app.className = 'ng-play';
    var stage = document.createElement('div');
    stage.className = 'ng-stage';
    app.appendChild(stage);
    var canvas = document.createElement('canvas');
    canvas.tabIndex = 0;
    stage.appendChild(canvas);
    var renderer = NG.render.create(canvas);

    var sizeBox = null;    // created down with the save bar

    function applyScreenSize() {
      var size = NG.render.applyScreenSize(renderer, state);
      app.style.setProperty('--ng-view-w', size.w + 'px');
    }

    function showSizePicker() {
      if (!sizeBox) return;
      NG.ui.screenSizePicker(sizeBox, state.screenSize, function (i) {
        state.screenSize = i;
        applyScreenSize();
        canvas.focus();
      });
    }

    applyScreenSize();

    var convoBox = document.createElement('div');
    convoBox.className = 'ng-convo-host';
    stage.appendChild(convoBox);

    var shopBox = document.createElement('div');
    shopBox.className = 'ng-shop-host';
    stage.appendChild(shopBox);

    var bagBox = document.createElement('div');
    bagBox.className = 'ng-bag-host';
    stage.appendChild(bagBox);

    var fightBox = document.createElement('div');
    fightBox.className = 'ng-fight-host';
    stage.appendChild(fightBox);

    var ambientView = NG.ui.ambientLayer(stage);

    var hudBox = document.createElement('div');
    app.appendChild(hudBox);
    var hud = NG.ui.hud(hudBox);

    var input = NG.input.create();
    NG.game._teardown.push(NG.input.attach(input, window));
    var controls = document.createElement('div');
    controls.className = 'ng-controls';
    var touchPad = NG.input.makeTouchPad(input);
    NG.game._teardown.push(touchPad.ngDetach);
    controls.appendChild(touchPad);

    function livingParty() { return NG.game.livingParty(state.party); }

    function doEat() {
      if (state.gameOver) return;
      var pos = { x: state.human.x, y: state.human.y };
      var picked = NG.actions.pickBerry(state.world, pos, state.clock.day);
      if (picked > 0) {
        state.berries += picked;
        NG.ui.toast(app, 'You picked a berry!');
        NG.audio.play('pick');
        return;
      }
      if (state.berries > 0) {
        state.berries -= 1;
        NG.actions.feed(state.human, 1);
        var alive = livingParty();
        for (var i = 0; i < alive.length; i++) NG.actions.feed(alive[i], 1);
        NG.ui.toast(app, 'Yum! That berry hit the spot.');
        NG.audio.play('pick');
        return;
      }
      var bought = NG.game.foodInBag(state);
      if (bought) {
        var name = NG.items.get(bought).name;
        if (NG.worn.use(state, bought, -1)) {
          NG.ui.toast(app, 'You ate the ' + name + '.');
          NG.audio.play('pick');
          return;
        }
      }
      NG.ui.toast(app, 'You have nothing to eat. There are berries in the forest.');
    }

    function doDrink() {
      if (state.gameOver) return;
      var pos = { x: state.human.x, y: state.human.y };
      var entities = [state.human];
      var alive = livingParty();
      for (var i = 0; i < alive.length; i++) entities.push(alive[i]);
      if (NG.actions.drink(state.world, pos, entities)) {
        NG.ui.toast(app, 'Ahh, refreshing!');
        NG.audio.play('drink');
      } else {
        NG.ui.toast(app, 'There is no water here.');
      }
    }

    function doPlay() {
      if (state.gameOver) return;
      var alive = livingParty();
      if (alive.length === 0) {
        NG.ui.toast(app, "You don't have a pet to play with yet.");
        return;
      }
      for (var i = 0; i < alive.length; i++) NG.actions.play(alive[i]);
      NG.ui.toast(app, 'You played with ' + NG.pets.nameOf(alive[0]) + '!');
      NG.audio.play('coin');
    }

    function doBag() {
      if (state.gameOver) return;
      NG.game.openBag(state);
    }

    function doInteract() { return NG.game.interact(state); }

    function onActionKey(e) {
      if (e.repeat) return;
      var k = (e.key || '').toLowerCase();
      if (k === 'e') { e.preventDefault(); doEat(); }
      else if (k === 'q') { e.preventDefault(); doDrink(); }
      else if (k === 'f') { e.preventDefault(); doPlay(); }
      else if (k === 'b') { e.preventDefault(); doBag(); }
      else if (k === ' ' || k === 'spacebar') { if (doInteract()) e.preventDefault(); }
    }
    window.addEventListener('keydown', onActionKey);
    NG.game._teardown.push(function () {
      window.removeEventListener('keydown', onActionKey);
    });

    var actionPad = document.createElement('div');
    actionPad.className = 'actionpad';
    var actionDefs = [['eat', 'Eat', doEat], ['drink', 'Drink', doDrink],
                      ['play', 'Play', doPlay], ['bag', 'Bag', doBag],
                      ['interact', 'Interact', doInteract]];
    for (var ai = 0; ai < actionDefs.length; ai++) {
      var actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.setAttribute('data-' + actionDefs[ai][0], '');
      actionBtn.textContent = actionDefs[ai][1];
      actionBtn.addEventListener('click', actionDefs[ai][2]);
      actionPad.appendChild(actionBtn);
    }
    controls.appendChild(actionPad);
    app.appendChild(controls);

    var handlers = {
      save: function () {
        var ok = NG.save.write(state, NG.save.getStorage());
        NG.ui.toast(app, ok ? 'Game saved!' : 'Could not save on this device.');
      },
      exportFile: function () { NG.game.exportFile(state); },
      copyText: function () {
        var text = NG.save.toJSON(state);
        function fallback() { NG.game.showSaveText(app, text); }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              NG.ui.toast(app, 'Save copied! Paste it somewhere safe.');
            }, fallback);
          } else fallback();
        } catch (e) { fallback(); }
      },
      importFile: function (text) {
        try {
          state = NG.save.fromJSON(text);
          NG.game.begin(app, state);
          NG.ui.toast(app, 'Save loaded!');
        } catch (e) { NG.ui.toast(app, e.message); }
      },
      restart: function () { NG.game.start(); },
      load: function () {
        var loaded = NG.save.read(NG.save.getStorage());
        if (loaded) { state = loaded; NG.game.begin(app, state); }
        else NG.ui.toast(app, 'There is no saved game on this device.');
      }
    };

    var saveBox = document.createElement('div');
    app.appendChild(saveBox);
    NG.ui.saveBar(saveBox, handlers);
    var musicButton = document.createElement('button');
    musicButton.type = 'button';
    musicButton.setAttribute('data-music', '');
    saveBox.appendChild(musicButton);
    NG.game._teardown.push(NG.audio.bindMusic(function () { return state; },
      musicButton, app, document, NG.save.getStorage()));

    sizeBox = document.createElement('div');
    app.appendChild(sizeBox);
    showSizePicker();

    function autosave() {
      try { NG.save.write(state, NG.save.getStorage()); }
      catch (e) { /* a failed autosave must never interrupt play */ }
    }
    function saveOnHide() { if (document.hidden) autosave(); }
    var autosaveTimer = setInterval(autosave, NG.C.AUTOSAVE_MS);
    window.addEventListener('beforeunload', autosave);
    document.addEventListener('visibilitychange', saveOnHide);
    NG.game._teardown.push(function () {
      clearInterval(autosaveTimer);
      window.removeEventListener('beforeunload', autosave);
      document.removeEventListener('visibilitychange', saveOnHide);
    });

    var nudgeBox = document.createElement('div');
    nudgeBox.className = 'ng-overlay-host';
    app.appendChild(nudgeBox);

    var askBox = document.createElement('div');
    askBox.className = 'ng-overlay-host';
    app.appendChild(askBox);
    state.ui = {
      ambient: function () { ambientView.update(state); },
      ask: function (question, yes, no) {
        NG.ui.confirm(askBox, question, { yes: yes, no: no });
      },
      choosePet: function (pets, pick) {
        NG.ui.choosePet(askBox, pets, pick);
      },
      shop: function (stall, onClose) {
        NG.ui.shop(shopBox, state, stall, {
          change: function () { hud.update(state); },
          close: function () {
            onClose();
            canvas.focus();
          }
        });
      },
      bag: function (onClose) {
        NG.ui.bag(bagBox, state, {
          change: function () { hud.update(state); },
          close: function () {
            onClose();
            canvas.focus();
          }
        });
      },
      fight: function (onClose) {
        var panel = NG.ui.fight(fightBox, state, {
          change: function () { hud.update(state); },
          close: function () {
            onClose();
            canvas.focus();
          }
        });
        NG.game._teardown.push(function () { panel.close(); });
      },
      talk: function (convo, onClose) {
        NG.ui.conversation(convoBox, convo, {
          choose: function (i) { return NG.game.chooseInTalk(state, i); },
          close: function () {
            onClose();
            canvas.focus();
          }
        });
      }
    };

    NG.audio.init();
    canvas.focus();

    var lastFrame = performance.now(), stepCooldown = 0;
    var stopped = false;
    NG.game._teardown.push(function () { stopped = true; });

    function frame(now) {
      if (stopped) return;
      var dt = now - lastFrame;
      lastFrame = now;

      if (dt > 250) dt = 250;

      NG.travel.update(state, dt);
      NG.audio.updateMusic(state, !!document.hidden);

      NG.game.tick(state, NG.clock.realMsToGameMinutes(dt));

      stepCooldown -= dt;
      var dir = input.stepThisFrame(stepCooldown <= 0);
      if (dir) {
        NG.game.takeStep(state, dir.dx, dir.dy);
        stepCooldown = NG.worn.stepMs(state.worn);
      }

      NG.game.drainEvents(state, app, nudgeBox, handlers);
      NG.render.draw(renderer, state);
      hud.update(state);

      if (state.gameOver && state.events.length === 0) { NG.audio.stopMusic(); return; }
      requestAnimationFrame(safeFrame);
    }

    function safeFrame(now) {
      try {
        frame(now);
      } catch (err) {
        stopped = true;
        NG.audio.stopMusic();
        try {
          NG.ui.toast(app, 'Something went wrong. Your game has been paused — ' +
                            'save to a file, then reload the page.');
        } catch (e2) { /* nothing more we can do */ }
        if (window.console && console.error) console.error('Nineange frame error:', err);
      }
    }
    requestAnimationFrame(function (now) { lastFrame = now; safeFrame(now); });
  },

  drainEvents: function (state, app, nudgeBox, handlers) {
    while (state.events.length) {
      var e = state.events.shift();
      if (e.type === 'coin') NG.audio.play('coin');
      else if (e.type === 'eggfound') { NG.audio.play('pick'); NG.ui.toast(app, 'You found an egg! Keep walking.'); }
      else if (e.type === 'hatch') {
        NG.audio.play('hatch');
        var hatched = e.kind || 'pet';
        NG.ui.toast(app, 'Your ' + hatched + ' hatched!');
        NG.ui.exportNudge(nudgeBox, handlers, hatched);
        NG.game.askForName(state, app, e.pet);
      }
      else if (e.type === 'title') { NG.audio.play('milestone'); NG.ui.toast(app, 'You are now ' + e.name + '!'); }
      else if (e.type === 'milestone') { NG.audio.play('milestone'); NG.ui.toast(app, 'Your pet grew stronger!'); }
      else if (e.type === 'slept') { NG.audio.play('drink'); NG.ui.toast(app, 'You slept until morning.'); }
      else if (e.type === 'say') NG.ui.toast(app, e.text);
      else if (e.type === 'revived') {
        NG.audio.play('hatch');
        NG.ui.toast(app, e.name + ' is back! Look after this one.');
      }
      else if (e.type === 'gameover') {
        NG.audio.play('warning');
        NG.ui.endScreen(app, state, handlers);
      }
    }
  },

  showSaveText: function (app, text) {
    var box = document.createElement('div');
    box.className = 'ng-savetext';
    var label = document.createElement('div');
    label.textContent = 'Copy this text and keep it somewhere safe:';
    box.appendChild(label);
    var area = document.createElement('textarea');
    area.readOnly = true;
    area.value = text;
    box.appendChild(area);
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'ng-btn ng-btn-util';
    close.textContent = 'Done';
    close.addEventListener('click', function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    });
    box.appendChild(close);
    app.appendChild(box);
    area.focus();
    area.select();
    return box;
  },

  exportFile: function (state) {
    var blob = new Blob([NG.save.toJSON(state)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nineange-save.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
};

NG.game.start();
</script>
