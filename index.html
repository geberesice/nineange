/* ---- src/shop.js ---- */
NG.shop = {

  stockFor: function (stall) {
    return NG.items.forStall(stall);
  },

  coinsOf: function (state) {
    var c = state ? state.coins : 0;
    return (typeof c === 'number' && isFinite(c)) ? c : 0;
  },


  whyNotBuy: function (state, id, n) {
    if (!state) return 'There is nobody to buy from.';
    var it = NG.items.get(id);
    if (!it || it.buyable === false) return 'That is not for sale.';
    if (!NG.bag.okAmount(n)) return 'Choose how many first.';
    var cost = NG.items.price(id) * n;
    if (this.coinsOf(state) < cost) return 'You need ' + cost + ' coins.';
    if (NG.bag.isFull(state.bag) && NG.bag.count(state.bag, id) === 0) {
      return 'Your bag is full.';
    }
    return null;
  },

  canBuy: function (state, id, n) {
    return this.whyNotBuy(state, id, (n === undefined) ? 1 : n) === null;
  },

  buy: function (state, id, n) {
    if (this.whyNotBuy(state, id, n) !== null) return false;
    var cost = NG.items.price(id) * n;
    if (!NG.bag.add(state.bag, id, n)) return false;
    state.coins = this.coinsOf(state) - cost;
    return true;
  },


  canSell: function (stall, id) {
    var it = NG.items.get(id);
    if (!it) return false;
    if (it.stall !== stall) return false;
    return NG.items.sellPrice(id) > 0;
  },

  sellPriceFor: function (stall, id) {
    return this.canSell(stall, id) ? NG.items.sellPrice(id) : 0;
  },

  hasToSell: function (state, id, n) {
    if (!state || !NG.bag.okAmount(n)) return false;
    if (id === 'berry') {
      var picked = state.berries;
      if (typeof picked !== 'number' || !isFinite(picked)) return false;
      return picked >= n;
    }
    return NG.bag.has(state.bag, id, n);
  },

  whyNotSell: function (state, stall, id, n) {
    if (!state) return 'There is nobody to sell to.';
    if (!this.canSell(stall, id)) return 'They do not buy those here.';
    if (!NG.bag.okAmount(n)) return 'Choose how many first.';
    if (!this.hasToSell(state, id, n)) return 'You have not got that many.';
    return null;
  },

  sell: function (state, stall, id, n) {
    if (this.whyNotSell(state, stall, id, n) !== null) return false;
    var pay = this.sellPriceFor(stall, id) * n;
    if (id === 'berry') {
      if (!this.hasToSell(state, id, n)) return false;
      state.berries -= n;
    } else if (!NG.bag.remove(state.bag, id, n)) {
      return false;
    }
    state.coins = this.coinsOf(state) + pay;
    return true;
  },


  keeperOf: function (stall) {
    if (!NG.npcs) return null;
    var people = NG.npcs.list();
    for (var i = 0; i < people.length; i++) {
      if (people[i].stall === stall) return people[i];
    }
    return NG.npcs.get(stall);
  },

  isOpen: function (state, stall) {
    var who = this.keeperOf(stall);
    if (!who) return false;
    return NG.npcs.isHere(state, who.id);
  }
};

/* ---- src/jobs.js ---- */
NG.jobs = {

  FETCH_THINGS: ['berry'],

  PLURAL: { berry: 'berries' },

  GIVER_ROLES: { innkeeper: true, villager: true },

  current: function (state) {
    return (state && state.job) ? state.job : null;
  },

  has: function (state) {
    return this.current(state) !== null;
  },


  payOf: function (job) {
    var J = NG.C.JOB;
    var pay = job ? job.pay : null;
    if (typeof pay !== 'number' || !isFinite(pay)) return J.MIN_PAY;
    pay = Math.floor(pay);
    if (pay < J.MIN_PAY) return J.MIN_PAY;
    if (pay > J.MAX_PAY) return J.MAX_PAY;
    return pay;
  },

  nOf: function (job) {
    var J = NG.C.JOB;
    var n = job ? job.n : null;
    if (!NG.bag.okAmount(n)) return J.FETCH_MIN;
    if (n < J.FETCH_MIN) return J.FETCH_MIN;
    if (n > J.FETCH_MAX) return J.FETCH_MAX;
    return n;
  },

  givesWork: function (npcId) {
    var who = NG.npcs.get(npcId);
    if (!who) return false;
    return Object.prototype.hasOwnProperty.call(this.GIVER_ROLES, who.role);
  },

  TAKER_ROLES: { innkeeper: true, vet: true, villager: true, stallholder: true },

  takesParcels: function (npcId) {
    var who = NG.npcs.get(npcId);
    if (!who) return false;
    return Object.prototype.hasOwnProperty.call(this.TAKER_ROLES, who.role);
  },

  deliveryTargets: function (fromId) {
    var out = [];
    var people = NG.npcs.list();
    for (var i = 0; i < people.length; i++) {
      var p = people[i];
      if (p.id === fromId) continue;
      if (!this.takesParcels(p.id)) continue;
      out.push(p.id);
    }
    return out;
  },

  seedFor: function (state, npcId) {
    var h = 2166136261;
    var s = String(npcId);
    for (var i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    }
    var steps = (state && typeof state.steps === 'number' && isFinite(state.steps))
      ? Math.floor(state.steps) : 0;
    return (h ^ Math.imul(steps, 2654435761)) >>> 0;
  },

  make: function (state, npcId) {
    var J = NG.C.JOB;
    var r = NG.rng(this.seedFor(state, npcId));

    var pay = J.MIN_PAY + r.int(J.MAX_PAY - J.MIN_PAY + 1);

    var targets = this.deliveryTargets(npcId);
    if (targets.length > 0 && r.int(2) === 0) {
      return {
        kind: 'deliver',
        from: npcId,
        to: targets[r.int(targets.length)],
        pay: pay
      };
    }

    var what = this.FETCH_THINGS[r.int(this.FETCH_THINGS.length)];
    return {
      kind: 'fetch',
      from: npcId,
      what: what,
      n: J.FETCH_MIN + r.int(J.FETCH_MAX - J.FETCH_MIN + 1),
      pay: pay
    };
  },

  whyNotOffer: function (state, npcId) {
    if (!state) return 'There is nobody here to ask.';
    var who = NG.npcs.get(npcId);
    if (!who) return 'There is nobody here to ask.';
    if (!this.givesWork(npcId)) {
      return who.name + ' has no errands. Try the inn, or knock on a door in one of the villages.';
    }
    var held = this.current(state);
    if (held) return 'Finish what you have got first. ' + this.describe(held);
    return null;
  },

  canOffer: function (state, npcId) {
    return this.whyNotOffer(state, npcId) === null;
  },

  offer: function (state, npcId) {
    var why = this.whyNotOffer(state, npcId);
    if (why !== null) return { refusedBecause: why };
    return this.make(state, npcId);
  },

  accept: function (state, job) {
    if (!state || !job) return false;
    if (this.current(state)) return false;
    if (!NG.npcs.get(job.from)) return false;

    if (job.kind === 'deliver') {
      if (!NG.npcs.get(job.to) || job.to === job.from) return false;
      state.job = { kind: 'deliver', from: job.from, to: job.to, pay: this.payOf(job) };
      return true;
    }

    if (job.kind === 'fetch') {
      var known = false;
      for (var i = 0; i < this.FETCH_THINGS.length; i++) {
        if (this.FETCH_THINGS[i] === job.what) known = true;
      }
      if (!known) return false;
      state.job = {
        kind: 'fetch', from: job.from, what: job.what,
        n: this.nOf(job), pay: this.payOf(job)
      };
      return true;
    }

    return false;
  },

  carrying: function (state, job) {
    if (!job || job.kind !== 'fetch') return false;
    return NG.shop.hasToSell(state, job.what, this.nOf(job));
  },

  isDoneBy: function (state, npcId) {
    var job = this.current(state);
    if (!job || !npcId) return false;
    if (job.kind === 'deliver') return job.to === npcId;
    if (job.kind === 'fetch') return job.from === npcId && this.carrying(state, job);
    return false;
  },

  takeGoods: function (state, job) {
    if (!job || job.kind !== 'fetch') return true;   // a parcel weighs nothing
    if (!this.carrying(state, job)) return false;
    var n = this.nOf(job);
    if (job.what === 'berry') {
      state.berries -= n;
      return true;
    }
    return NG.bag.remove(state.bag, job.what, n);
  },

  handIn: function (state, npcId) {
    if (!this.isDoneBy(state, npcId)) return false;
    var job = this.current(state);

    if (!this.takeGoods(state, job)) return false;

    state.job = null;
    state.coins = NG.shop.coinsOf(state) + this.payOf(job);
    return true;
  },

  abandon: function (state) {
    if (!this.current(state)) return false;
    state.job = null;
    return true;
  },

  nameOf: function (npcId) {
    var who = NG.npcs.get(npcId);
    return who ? who.name : 'somebody';
  },

  thingWords: function (what, n) {
    var word = Object.prototype.hasOwnProperty.call(this.PLURAL, what)
      ? this.PLURAL[what] : null;
    if (!word) {
      var it = NG.items.get(what);
      word = it ? it.name : what;
    }
    return n + ' ' + word;
  },

  describe: function (job) {
    if (!job) return 'You have no errand on just now.';
    if (job.kind === 'deliver') {
      return 'Take this parcel to ' + this.nameOf(job.to) +
        ', for ' + this.payOf(job) + ' coins.';
    }
    if (job.kind === 'fetch') {
      return 'Bring ' + this.thingWords(job.what, this.nOf(job)) + ' to ' +
        this.nameOf(job.from) + ', for ' + this.payOf(job) + ' coins.';
    }
    return 'You have no errand on just now.';
  }
};

/* ---- src/creature.js ---- */
NG.creature = {
  createEgg: function (rng) {
    return { steps: 0, ready: false, species: NG.pets.pick(rng) };
  },

  stepEgg: function (egg) {
    if (egg.ready) return egg;
    egg.steps += 1;
    if (egg.steps >= NG.C.HATCH_STEPS) egg.ready = true;
    return egg;
  },

  hatch: function (egg) {
    var pet = NG.stats.create('pet');
    pet.species = NG.pets.speciesOf(egg).id;
    pet.name = NG.pets.hatchNameOf(pet);
    pet.downedAtStep = null;
    pet.lost = false;
    pet.cleanDay = true;
    pet.age = 0;
    NG.stats.fill(pet, 'hp');
    pet.x = 0; pet.y = 0;
    return pet;
  },

  updateFollow: function (party, trail) {
    for (var i = 0; i < party.length; i++) {
      if (party[i].lost) continue;
      var spot = trail[i + 1] || trail[trail.length - 1] || trail[0];
      party[i].x = spot.x;
      party[i].y = spot.y;
    }
  },

  onStep: function (party, stepCount) {
    for (var i = 0; i < party.length; i++) {
      var pet = party[i];
      if (pet.lost) continue;
      if (pet.hp <= 0) {
        if (pet.downedAtStep === null) pet.downedAtStep = stepCount;
        else if (stepCount - pet.downedAtStep >= NG.C.DOWNED_STEPS) pet.lost = true;
      } else {
        pet.downedAtStep = null;   // healed in time
      }
    }
  },

  tickDay: function (pet) {
    if (pet.lost) return pet;   // a lost pet is gone: it does not grow, ever
    pet.cleanDay = true;
    pet.age = NG.pets.ageOf(pet);
    if (pet.age >= NG.C.TEEN_AGE) return pet;   // a teenager has finished

    var maxBefore = NG.pets.maxHpOf(pet);
    pet.age += 1;
    var maxAfter = NG.pets.maxHpOf(pet);
    if (maxAfter > maxBefore && typeof pet.hp === 'number' && isFinite(pet.hp)) {
      NG.stats.restore(pet, 'hp', maxAfter - maxBefore);
    }
    return pet;
  },

  milestoneReached: function (pet, previousAge) {
    if (typeof previousAge !== 'number' || !isFinite(previousAge)) previousAge = 0;
    return NG.pets.ageOf(pet) > previousAge;
  },

  isLost: function (pet) { return pet.lost === true; },

  mend: function (pet) {
    if (!pet) return null;
    NG.stats.fill(pet, 'hp');
    pet.downedAtStep = null;
    pet.lost = false;
    return pet;
  }
};

/* ---- src/actions.js ---- */
NG.actions = {
  bushAt: function (world, pos) {
    for (var i = 0; i < world.bushes.length; i++) {
      var b = world.bushes[i];
      if (b.x === pos.x && b.y === pos.y) return b;
    }
    return null;
  },

  pickBerry: function (world, pos, day) {
    var b = this.bushAt(world, pos);
    if (!b || b.picked) return 0;
    b.picked = true;
    b.regrowAtDay = day + NG.C.BUSH_REGROW_DAYS;
    return 1;
  },

  regrowBushes: function (world, day) {
    for (var i = 0; i < world.bushes.length; i++) {
      var b = world.bushes[i];
      if (b.picked && day >= b.regrowAtDay) b.picked = false;
    }
  },

  feed: function (entity, berries) {
    if (berries < 0) berries = 0;
    NG.stats.restore(entity, 'hunger', NG.C.BERRY_RESTORE * berries);
    return entity;
  },

  drink: function (world, pos, entities) {
    if (!NG.world.isWaterAdjacent(world, pos.x, pos.y)) return false;
    for (var i = 0; i < entities.length; i++) {
      NG.stats.restore(entities[i], 'thirst', NG.C.DRINK_RESTORE);
    }
    return true;
  },

  play: function (pet) {
    NG.stats.restore(pet, 'fun', NG.C.PLAY_RESTORE);
    return pet;
  },

  collectCoin: function (world, pos) {
    for (var i = 0; i < world.coins.length; i++) {
      var c = world.coins[i];
      if (!c.taken && c.x === pos.x && c.y === pos.y) { c.taken = true; return 1; }
    }
    return 0;
  }
};

/* ---- src/score.js ---- */
NG.score = {
  create: function () {
    return { total: 0, coinsEarned: 0, regions: {}, title: 'Wanderer' };
  },

  award: function (score, kind, amount) {
    var n = (amount === undefined) ? 1 : amount;
    if (typeof n !== 'number' || !isFinite(n) || n < 0) n = 0;
    if (!NG.C.SCORE.hasOwnProperty(kind)) throw new Error('unknown score kind: ' + kind);
    var value = NG.C.SCORE[kind];
    score.total += value * n;
    if (kind === 'coin') score.coinsEarned += n;
    return score.total;
  },

  visitRegion: function (score, map, x, y) {
    if (!map || !NG.grid.inBounds(map, x, y)) return false;
    var key = NG.grid.regionKey(map, x, y);
    if (score.regions[key]) return false;
    score.regions[key] = true;
    this.award(score, 'region');
    return true;
  },

  titleFor: function (total) {
    var best = null, lowest = NG.C.TITLES[0];
    for (var i = 0; i < NG.C.TITLES.length; i++) {
      var t = NG.C.TITLES[i];
      if (t.at < lowest.at) lowest = t;
      if (total >= t.at && (best === null || t.at > best.at)) best = t;
    }
    return (best || lowest).name;
  },

  repairTitle: function (score) {
    if (!score || typeof score.title !== 'string') return null;
    for (var i = 0; i < NG.C.TITLES.length; i++) {
      if (NG.C.TITLES[i].name === score.title) return null;
    }
    var total = (typeof score.total === 'number' && isFinite(score.total)) ? score.total : 0;
    score.title = this.titleFor(total);
    return score.title;
  },

  repaired: function (score) {
    this.repairTitle(score);
    return score;
  },

  refreshTitle: function (score) {
    var next = this.titleFor(score.total);
    if (next === score.title) return null;
    var nextAt, currentAt;
    for (var i = 0; i < NG.C.TITLES.length; i++) {
      var t = NG.C.TITLES[i];
      if (t.name === next) nextAt = t.at;
      if (t.name === score.title) currentAt = t.at;
    }
    if (nextAt < currentAt) return null;
    score.title = next;
    return next;
  }
};

/* ---- src/save.js ---- */
NG.save = {
  forestOf: function (state) {
    if (state.world && state.world.id === 'forest') return state.world;
    return NG.travel.get('forest') || state.world;
  },

  townOf: function (state) {
    if (state.world && state.world.id === 'town') return state.world;
    return NG.travel.get('town') || null;
  },

  eggRecords: function (map) {
    var out = [], lying = (map && map.eggs) ? map.eggs : [];
    for (var i = 0; i < lying.length; i++) {
      var e = lying[i];
      if (!e) continue;
      out.push({ x: e.x, y: e.y, taken: !!e.taken, species: e.species || null });
    }
    return out;
  },

  restoreEggs: function (map, saved) {
    if (!map || !(saved instanceof Array)) return;
    var lying = map.eggs || [];
    for (var i = 0; i < lying.length && i < saved.length; i++) {
      var rec = saved[i];
      if (!lying[i] || !rec || typeof rec !== 'object') continue;
      if (typeof rec.x === 'number' && isFinite(rec.x)) lying[i].x = Math.floor(rec.x);
      if (typeof rec.y === 'number' && isFinite(rec.y)) lying[i].y = Math.floor(rec.y);
      lying[i].taken = !!rec.taken;
      if (rec.species) lying[i].species = NG.pets.speciesOf({ species: rec.species }).id;
    }
  },

  serialise: function (state) {
    var forest = this.forestOf(state);
    var coinsTaken = [], i;
    for (i = 0; i < forest.coins.length; i++) {
      if (forest.coins[i].taken) coinsTaken.push(i);
    }
    var bushesPicked = [];
    for (i = 0; i < forest.bushes.length; i++) {
      var b = forest.bushes[i];
      if (b.picked) bushesPicked.push({ i: i, regrowAtDay: b.regrowAtDay });
    }
    var lying = forest.eggs || [], eggsTaken = [], eggSpecies = [], eggSpots = [];
    for (i = 0; i < lying.length; i++) {
      if (lying[i] && lying[i].taken) eggsTaken.push(i);
      eggSpots.push(lying[i] ? { x: lying[i].x, y: lying[i].y } : null);
      eggSpecies.push(lying[i] ? lying[i].species : null);
    }
    var carried = state.eggs || [];
    return {
      version: NG.C.SAVE_VERSION,
      savedAt: new Date().toISOString(),
      currentMap: state.world ? state.world.id : 'forest',
      visited: state.visited || {},
      screenSize: NG.screenSizeIndex(state.screenSize),
      world: { seed: forest.seed, coinsTaken: coinsTaken, bushesPicked: bushesPicked,
               eggsTaken: eggsTaken,
               eggSpecies: eggSpecies,
               eggSpots: eggSpots,
               robinBeaten: !!(forest.robin && forest.robin.beaten),
               eggTaken: (lying[0] ? !!lying[0].taken : false) },
      town: { eggs: this.eggRecords(this.townOf(state)) },
      human: state.human,
      party: state.party,
      eggs: carried,
      egg: carried.length ? carried[0] : null,
      clock: state.clock,
      score: state.score,
      coins: state.coins,
      berries: state.berries,
      steps: state.steps,
      bag: NG.bag.list(state.bag),
      worn: state.worn || NG.worn.create(),
      job: state.job || null,
      met: state.met || {},
      beaten: state.beaten || {},
      trail: state.trail
    };
  },

  deserialise: function (data) {
    var v = data.version;
    if (typeof v !== 'number' || !isFinite(v)) {
      throw new Error("This save doesn't say what version of Nineange made it, so the game " +
                      'cannot tell whether it is compatible. This game reads version ' +
                      NG.C.SAVE_VERSION + ' saves.');
    }
    if (v !== NG.C.SAVE_VERSION) {
      if (v === 1) {
        throw new Error('This save was made before Starter Town existed, so it ' +
                        'cannot be opened by this version of the game.');
      }
      if (v === 2) {
        throw new Error('This save was made before the townspeople moved in, so it ' +
                        'cannot be opened by this version of the game. Start a new ' +
                        'game to meet the people of the town.');
      }
      throw new Error('This save was made by a different version of Nineange (' +
                      v + '). This game reads version ' + NG.C.SAVE_VERSION + '.');
    }
    if (!data.world || typeof data.world !== 'object') {
      throw new Error('This save has no world in it, so there is nothing to load.');
    }
    var seed = data.world.seed;
    if (typeof seed !== 'number' || !isFinite(seed)) {
      throw new Error("This save's world seed is missing or damaged, so Nineange cannot " +
                      'rebuild the forest it belongs to. This save cannot be loaded.');
    }

    var MISSING = {
      human: 'the player',
      party: 'the list of pets',
      clock: 'the time of day',
      score: 'the score'
    };
    for (var key in MISSING) {
      if (!Object.prototype.hasOwnProperty.call(MISSING, key)) continue;
      if (!data[key] || typeof data[key] !== 'object') {
        throw new Error('This save is missing ' + MISSING[key] +
                        ', so Nineange cannot load it. (The "' + key +
                        '" part of the file is missing or damaged.)');
      }
    }
    if (!(data.party instanceof Array)) {
      throw new Error('This save\'s list of pets is damaged, so Nineange cannot load it.');
    }
    var NUMBERS = ['coins', 'berries', 'steps'];
    for (var n = 0; n < NUMBERS.length; n++) {
      var val = data[NUMBERS[n]];
      if (typeof val !== 'number' || !isFinite(val)) {
        throw new Error('This save\'s "' + NUMBERS[n] + '" is missing or is not a number, ' +
                        'so Nineange cannot load it.');
      }
    }

    var world = NG.world.generate(seed);
    var i;
    for (i = 0; i < data.world.coinsTaken.length; i++) {
      var c = world.coins[data.world.coinsTaken[i]];
      if (c) c.taken = true;
    }
    for (i = 0; i < data.world.bushesPicked.length; i++) {
      var rec = data.world.bushesPicked[i], b = world.bushes[rec.i];
      if (b) {
        b.picked = true;
        b.regrowAtDay = (typeof rec.regrowAtDay === 'number' && isFinite(rec.regrowAtDay))
          ? rec.regrowAtDay : 0;
      }
    }
    var takenEggs = this.readEggsTaken(data.world);
    for (i = 0; i < takenEggs.length; i++) {
      var lyingEgg = world.eggs[takenEggs[i]];
      if (lyingEgg) lyingEgg.taken = true;
    }
    var savedSpots = data.world ? data.world.eggSpots : null;
    if (savedSpots instanceof Array) {
      for (i = 0; i < world.eggs.length && i < savedSpots.length; i++) {
        var spot = savedSpots[i];
        if (!world.eggs[i] || !spot || typeof spot !== 'object') continue;
        if (typeof spot.x !== 'number' || !isFinite(spot.x)) continue;
        if (typeof spot.y !== 'number' || !isFinite(spot.y)) continue;
        world.eggs[i].x = Math.floor(spot.x);
        world.eggs[i].y = Math.floor(spot.y);
      }
    }
    var savedSpecies = data.world ? data.world.eggSpecies : null;
    if (savedSpecies instanceof Array) {
      for (i = 0; i < world.eggs.length && i < savedSpecies.length; i++) {
        if (!world.eggs[i] || !savedSpecies[i]) continue;
        world.eggs[i].species = NG.pets.speciesOf({ species: savedSpecies[i] }).id;
      }
    }
    if (world.robin && data.world.robinBeaten === true) world.robin.beaten = true;

    NG.game.buildMaps(world);

    if (data.town) this.restoreEggs(NG.travel.get('town'), data.town.eggs);

    for (i = 0; i < data.party.length; i++) {
      var pet = data.party[i];
      if (!pet || typeof pet !== 'object') continue;
      if (pet.worn) pet.worn = this.readWorn(pet.worn, NG.worn.createPet());
      this.readAge(pet);
    }

    var current = world, human = data.human;
    human.facing = NG.game.readFacing(human.facing);
    var named = (typeof data.currentMap === 'string') ? data.currentMap : 'forest';
    if (named !== 'forest') {
      var found = NG.travel.get(named);
      if (found) current = found;
      else { human.x = world.spawn.x; human.y = world.spawn.y; }
    }

    return {
      version: data.version,
      world: current,
      visited: this.readVisited(data.visited),
      screenSize: NG.screenSizeIndex(data.screenSize),
      human: data.human,
      party: data.party,
      eggs: this.readCarriedEggs(data),
      clock: data.clock,
      score: NG.score.repaired(data.score),
      coins: data.coins,
      berries: data.berries,
      steps: data.steps,
      bag: this.readBag(data.bag),
      worn: this.readWorn(data.worn, NG.worn.create()),
      job: this.readJob(data.job),
      met: this.readMet(data.met),
      beaten: this.readBeaten(data.beaten),
      trail: data.trail,
      events: [],
      transition: null,
      gameOver: false
    };
  },

  readAge: function (pet) {
    if (typeof pet.age !== 'number' || !isFinite(pet.age)) {
      var earned = Math.floor(Number(pet.power));
      pet.age = (isFinite(earned) && earned > 0) ? Math.min(NG.C.TEEN_AGE, earned) : 0;
    }
    pet.age = NG.pets.ageOf(pet);
    var ceiling = NG.stats.maxOf(pet, 'hp');
    if (typeof pet.hp === 'number' && isFinite(pet.hp) && pet.hp > ceiling) {
      pet.hp = ceiling;
    }
    return pet;
  },

  readVisited: function (visited) {
    var out = {};
    if (!visited || typeof visited !== 'object') return out;
    for (var id in visited) {
      if (!Object.prototype.hasOwnProperty.call(visited, id)) continue;
      var p = visited[id];
      if (!p || typeof p !== 'object') continue;
      if (typeof p.x !== 'number' || !isFinite(p.x)) continue;
      if (typeof p.y !== 'number' || !isFinite(p.y)) continue;
      out[id] = { x: p.x, y: p.y };
    }
    return out;
  },

  readEggsTaken: function (saved) {
    var out = [], i;
    if (!saved || typeof saved !== 'object') return out;
    if (saved.eggsTaken instanceof Array) {
      for (i = 0; i < saved.eggsTaken.length; i++) {
        var n = Math.floor(Number(saved.eggsTaken[i]));
        if (isFinite(n) && n >= 0) out.push(n);
      }
      return out;
    }
    if (saved.eggTaken) out.push(0);
    return out;
  },

  readCarriedEggs: function (data) {
    var out = [], i;
    if (!data || typeof data !== 'object') return out;
    if (data.eggs instanceof Array) {
      for (i = 0; i < data.eggs.length; i++) {
        if (data.eggs[i] && typeof data.eggs[i] === 'object') out.push(data.eggs[i]);
      }
      return out;
    }
    if (data.egg && typeof data.egg === 'object') out.push(data.egg);
    return out;
  },


  readBag: function (saved) {
    var bag = NG.bag.create();
    if (!saved || !(saved instanceof Array)) return bag;
    for (var i = 0; i < saved.length; i++) {
      var e = saved[i];
      if (!e || typeof e !== 'object') continue;
      NG.bag.add(bag, e.id, e.n);
    }
    return bag;
  },

  readWorn: function (worn, slots) {
    if (!worn || typeof worn !== 'object') return slots;
    for (var slot in slots) {
      if (!Object.prototype.hasOwnProperty.call(slots, slot)) continue;
      var id = worn[slot];
      if (typeof id !== 'string') continue;
      if (NG.items.slotOf(id) !== slot) continue;
      slots[slot] = id;
    }
    return slots;
  },

  readJob: function (job) {
    if (!job || typeof job !== 'object') return null;
    var holder = { job: null };
    NG.jobs.accept(holder, job);
    return holder.job;
  },

  readMet: function (met) {
    var out = {};
    if (!met || typeof met !== 'object') return out;
    for (var id in met) {
      if (!Object.prototype.hasOwnProperty.call(met, id)) continue;
      if (!met[id]) continue;
      if (!NG.npcs.get(id)) continue;
      out[id] = true;
    }
    return out;
  },

  readBeaten: function (beaten) {
    var out = {};
    if (!beaten || typeof beaten !== 'object') return out;
    for (var id in beaten) {
      if (!Object.prototype.hasOwnProperty.call(beaten, id)) continue;
      if (typeof id !== 'string' || !id) continue;
      if (!beaten[id]) continue;
      out[id] = true;
    }
    return out;
  },

  toJSON: function (state) { return JSON.stringify(this.serialise(state), null, 2); },
  fromJSON: function (text) { return this.deserialise(JSON.parse(text)); },

  memoryStorage: function () {
    var store = {};
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
      setItem: function (k, v) { store[k] = String(v); }
    };
  },

  getStorage: function () {
    try { return window.localStorage; }
    catch (e) { return null; }
  },

  write: function (state, storage) {
    try { storage.setItem(NG.C.SAVE_KEY, this.toJSON(state)); return true; }
    catch (e) { return false; }
  },

  read: function (storage) {
    try {
      var text = storage.getItem(NG.C.SAVE_KEY);
      if (!text) return null;
      return this.fromJSON(text);
    } catch (e) { return null; }
  }
};

  toCanvas: function (rows, palette, scale) {
    if (typeof scale !== 'number' || !isFinite(scale) || scale <= 0) {
      throw new Error('NG.sprites.toCanvas: scale must be a positive, finite number — got ' + scale);
    }
    if (!rows || rows.length === 0) {
      throw new Error('NG.sprites.toCanvas: rows must not be empty');
    }
    var w = rows[0].length;
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].length !== w) {
        throw new Error('NG.sprites.toCanvas: row ' + r + ' has length ' + rows[r].length +
          ', but row 0 has length ' + w + ' — every row must be the same length');
      }
    }
    var s = scale;
    var h = rows.length;
    var cv = document.createElement('canvas');
    cv.width = w * s; cv.height = h * s;
    var ctx = cv.getContext('2d');
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = rows[y][x];
        if (ch === '.') continue;
        var colour = palette[ch];
        if (!colour) {
          throw new Error('NG.sprites.toCanvas: the palette has no colour for "' + ch +
            '" (row ' + y + ', column ' + x + ') — those pixels would vanish silently');
        }
        ctx.fillStyle = colour;
        ctx.fillRect(x * s, y * s, s, s);
      }
    }
    return cv;
  }

        if (NG.travel.doorAt(world, x, y)) continue;
        if (this.coinAt(world, x, y)) continue;
        var gap = Math.abs(NG.grid.chebyshev(spawn, { x: x, y: y }) - want);
        if (gap < bestGap) {
          bestGap = gap;
          best = { x: x, y: y, beaten: false, permanent: true };
        }
      }
    }
    world.robin = best;
    return best;
  },

  coinAt: function (world, x, y) {
    var coins = (world && world.coins) ? world.coins : [];
    for (var i = 0; i < coins.length; i++) {
      if (coins[i].x === x && coins[i].y === y) return true;
    }
    return false;
  },

  eggAt: function (world, x, y) {
    var eggs = (world && world.eggs) ? world.eggs : [];
    for (var i = 0; i < eggs.length; i++) {
      if (eggs[i] && eggs[i].x === x && eggs[i].y === y) return true;
    }
    return false;
  },

  robinAt: function (world, x, y) {
    if (!world || !world.robin || world.robin.beaten) return null;
    if (world.robin.x !== x || world.robin.y !== y) return null;
    return world.robin;
  }
};

  itemIcon: function (id, scale) {
    var def = Object.prototype.hasOwnProperty.call(this.ITEMS, id) ? this.ITEMS[id] : null;

  create: function (canvas) {

  noise: function (x, y) {
    var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;

    var tilesX = this.tileCount(viewW), tilesY = this.tileCount(viewH);
    var x = Math.round(state.human.x - tilesX / 2);
    var y = Math.round(state.human.y - tilesY / 2);
    x = (map.width <= tilesX) ? -Math.floor((tilesX - map.width) / 2)
                              : Math.max(0, Math.min(map.width - tilesX, x));
    y = (map.height <= tilesY) ? -Math.floor((tilesY - map.height) / 2)
                               : Math.max(0, Math.min(map.height - tilesY, y));

  nightAlpha: function (clock) {
    var MAX = 0.65;
    var m = clock.minutes;
    var duskEnd = NG.C.NIGHT_START_H * 60;   // 1080 (18:00) — full dark by here
    var duskStart = duskEnd - 60;            // 1020 (17:00) — ramp begins, at 0
    var dawnStart = NG.C.DAY_START_H * 60;   // 360  (06:00) — full dark until here
    var dawnEnd = dawnStart + 60;            // 420  (07:00) — ramp ends, at 0
    if (m >= duskStart && m < duskEnd) return MAX * ((m - duskStart) / 60);
    if (m >= duskEnd || m < dawnStart) return MAX;
    if (m >= dawnStart && m < dawnEnd) return MAX * (1 - (m - dawnStart) / 60);
    return 0;

  isInterior: function (map) {
    return !!map && map.layoutIndex !== undefined && map.layoutIndex !== null;

  roofFor: function (b) {
    if (this.ROOF[b.kind]) return this.ROOF[b.kind];
    var h = 0, id = b.id || '';
    for (var i = 0; i < id.length; i++) h = (Math.imul(h, 31) + id.charCodeAt(i)) >>> 0;
    return this.ROOF.HOUSES[h % this.ROOF.HOUSES.length];
  },

  roomPalette: function (map) {
    var named = map && map.id && this.ROOM[map.id];
    if (named && !(named instanceof Array)) return named;
    var list = this.ROOM.HOUSES, n = list.length;
    var i = Math.floor((map && map.paletteIndex) || 0) % n;
    if (i < 0) i += n;
    return list[i];
  },

  outwardOf: function (b) {
    if (b.doorY === b.y1) return { dx: 0, dy: -1 };
    if (b.doorY === b.y2) return { dx: 0, dy: 1 };
    if (b.doorX === b.x1) return { dx: -1, dy: 0 };
    if (b.doorX === b.x2) return { dx: 1, dy: 0 };
    return { dx: 0, dy: 1 };
  },

  facing: function (ctx, out) {
    ctx.rotate(Math.atan2(out.dy, out.dx) - Math.PI / 2);
  },


  blocksIn: function (map, cam, tilesX, tilesY) {
    var owner = new Array(tilesX * tilesY), covered = new Uint8Array(tilesX * tilesY);
    var i, x, y, x1, y1, x2, y2;
    var buildings = map.buildings || [];
    for (i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      x1 = Math.max(b.x1, cam.x); x2 = Math.min(b.x2, cam.x + tilesX - 1);
      y1 = Math.max(b.y1, cam.y); y2 = Math.min(b.y2, cam.y + tilesY - 1);
      for (y = y1; y <= y2; y++) {
        for (x = x1; x <= x2; x++) owner[(y - cam.y) * tilesX + (x - cam.x)] = b;
      }
    }
    var props = map.props || [];
    for (i = 0; i < props.length; i++) {
      var p = props[i], pw = p.w || 1, ph = p.h || 1;
      if (pw === 1 && ph === 1) continue;
      x1 = Math.max(p.x, cam.x); x2 = Math.min(p.x + pw - 1, cam.x + tilesX - 1);
      y1 = Math.max(p.y, cam.y); y2 = Math.min(p.y + ph - 1, cam.y + tilesY - 1);
      for (y = y1; y <= y2; y++) {
        for (x = x1; x <= x2; x++) covered[(y - cam.y) * tilesX + (x - cam.x)] = 1;
      }
    }
    return { owner: owner, covered: covered };

  drawTree: function (ctx, px, py) {
    var S = this.SKIN;
    function rect(colour, x, y, w, h) {
      ctx.fillStyle = colour; ctx.fillRect(px + x, py + y, w, h);
    }
    rect('#315e36', 8, 27, 18, 3);
    rect('#483829', 13, 18, 7, 12);
    rect(S.trunk, 14, 19, 4, 10);
    rect('#987047', 14, 22, 2, 6);
    rect(S.canopy, 10, 2, 12, 22);
    rect(S.canopy, 6, 6, 20, 16);
    rect(S.canopy, 4, 10, 24, 8);
    rect('#285d34', 8, 6, 16, 14);
    rect(S.canopyLit, 10, 4, 10, 6);
    rect(S.canopyLit, 6, 10, 10, 6);
    rect('#397344', 10, 6, 6, 2);
    rect('#397344', 6, 10, 4, 2);
    rect(S.canopyLit, 18, 12, 6, 6);
    rect(S.canopy, 12, 18, 4, 2);
  },

  drawBush: function (ctx, px, py, picked) {
    function rect(colour, x, y, w, h) {
      ctx.fillStyle = colour; ctx.fillRect(px + x, py + y, w, h);

    rect('#315e36', 6, 27, 22, 3);
    rect('#23492e', 8, 10, 16, 18);
    rect('#23492e', 4, 16, 24, 8);
    rect(this.SKIN.bushBody, 6, 16, 20, 8);
    rect(this.SKIN.bushBody, 10, 12, 12, 14);
    rect('#477b43', 10, 12, 8, 4);
    rect('#477b43', 6, 18, 6, 2);
    rect('#477b43', 20, 16, 4, 4);
    rect('#21452b', 12, 22, 4, 2);
    rect('#21452b', 22, 22, 4, 2);
    if (!picked) {
      var berries = [[10, 15], [20, 19], [14, 23]];
      for (var i = 0; i < berries.length; i++) {
        var x = berries[i][0], y = berries[i][1];
        rect('#692d35', x - 1, y - 1, 6, 6);
        rect('#d55462', x, y, 4, 4);
        rect('#ffb49d', x, y, 2, 1);

  drawCoin: function (r, coin, px, py) {
    var ctx = r.ctx;
    var frame = NG.ui.reducedMotion() ? 0 :
      Math.floor(this.animNow(r) / 140 + coin.x * 2 + coin.y) % 8;
    var widths = [12, 10, 6, 3, 6, 10, 12, 12];
    var w = widths[frame], x = px + Math.floor((NG.C.TILE - w) / 2), y = py + 9;
    ctx.fillStyle = '#60442c';
    ctx.fillRect(x + 2, y, Math.max(1, w - 4), 15);
    ctx.fillRect(x, y + 3, w, 9);
    ctx.fillStyle = '#d49332';
    ctx.fillRect(x + 1, y + 3, Math.max(1, w - 2), 9);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x + 1, y + 3, Math.max(1, w - 3), 7);
    ctx.fillRect(x + 2, y + 1, Math.max(1, w - 4), 11);
    ctx.fillStyle = '#fff0b0';
    ctx.fillRect(x + 2, y + 2, Math.max(1, w - 5), 2);

      ctx.fillStyle = '#b47628';

  },

  drawGroundTile: function (r, map, wx, wy, px, py, building, covered) {
    var ctx = r.ctx, T = NG.C.TILE, S = this.SKIN, TILE = NG.world.TILE;
    var t = NG.world.at(map, wx, wy);
    var n = this.noise(wx, wy), n2 = this.noise(wx + 977, wy + 311),
        n3 = this.noise(wx + 41, wy + 8123);

    if (building && t === TILE.TREE) {
      ctx.fillStyle = this.roofFor(building).eave;
      ctx.fillRect(px, py, T, T);
      return;
    }

    if (t === TILE.WATER) {
      ctx.fillStyle = S.water;
      ctx.fillRect(px, py, T, T);
      ctx.fillStyle = S.waterDeep;
      ctx.fillRect(px + 4, py + 4 + Math.floor(n * 10), 18, 2);
      ctx.fillStyle = S.waterLit;
      ctx.fillRect(px + Math.floor(n2 * 14), py + 7 + Math.floor(n * 8), 11, 2);
      ctx.fillRect(px + 6 + Math.floor(n3 * 14), py + 22 + Math.floor(n2 * 6), 8, 2);
      ctx.fillStyle = S.foam;
      if (NG.world.at(map, wx, wy - 1) !== TILE.WATER) ctx.fillRect(px, py, T, 3);
      if (NG.world.at(map, wx, wy + 1) !== TILE.WATER) ctx.fillRect(px, py + T - 3, T, 3);
      if (NG.world.at(map, wx - 1, wy) !== TILE.WATER) ctx.fillRect(px, py, 3, T);
      if (NG.world.at(map, wx + 1, wy) !== TILE.WATER) ctx.fillRect(px + T - 3, py, 3, T);
      return;
    }

    if (t === TILE.PATH) {
      ctx.fillStyle = S.road;
      ctx.fillRect(px, py, T, T);
      ctx.fillStyle = S.roadDark;
      ctx.fillRect(px + 2 + Math.floor(n * 24), py + 3 + Math.floor(n2 * 24), 3, 1);
      ctx.fillRect(px + 3 + Math.floor(n3 * 22), py + 2 + Math.floor(n * 26), 2, 1);
      ctx.fillStyle = S.roadLit;
      ctx.fillRect(px + 4 + Math.floor(n2 * 22), py + 5 + Math.floor(n3 * 22), 3, 1);
      ctx.fillStyle = S.kerb;
      if (NG.world.at(map, wx, wy - 1) !== TILE.PATH) ctx.fillRect(px, py, T, 3);
      if (NG.world.at(map, wx, wy + 1) !== TILE.PATH) ctx.fillRect(px, py + T - 3, T, 3);
      if (NG.world.at(map, wx - 1, wy) !== TILE.PATH) ctx.fillRect(px, py, 3, T);
      if (NG.world.at(map, wx + 1, wy) !== TILE.PATH) ctx.fillRect(px + T - 3, py, 3, T);
      return;
    }

    ctx.fillStyle = S.grass;
    ctx.fillRect(px, py, T, T);
    ctx.fillStyle = S.grassDark;
    var gx = px + 3 + Math.floor(n * 22), gy = py + 5 + Math.floor(n2 * 22);
    ctx.fillRect(gx, gy, 1, 3);
    ctx.fillRect(gx + 2, gy - 1, 1, 4);
    ctx.fillStyle = S.grassLit;
    ctx.fillRect(gx + 1, gy + 2, 1, 1);

    if (covered) return;

    if (t === TILE.TREE) {
      this.drawTree(ctx, px, py);
    }
    if (t === TILE.BUSH) {
      var bush = NG.actions.bushAt(map, { x: wx, y: wy });
      this.drawBush(ctx, px, py, !!(bush && bush.picked));
    }
  },


  drawBuilding: function (r, map, b, cam) {
    var ctx = r.ctx, T = NG.C.TILE, D = NG.C.DRAW, pal = this.roofFor(b);
    var x = (b.x1 - cam.x) * T, y = (b.y1 - cam.y) * T;
    var w = (b.x2 - b.x1 + 1) * T, h = (b.y2 - b.y1 + 1) * T;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(x + D.SHADOW, y + h, w, D.SHADOW);
    ctx.fillRect(x + w, y + D.SHADOW, D.SHADOW, h);

    ctx.fillStyle = pal.eave;
    ctx.fillRect(x, y, w, h);

    var ix = x + D.EAVE, iy = y + D.EAVE, iw = w - D.EAVE * 2, ih = h - D.EAVE * 2;
    var hip = Math.round(Math.min(iw, ih) * 0.36);
    var mx1, mx2, my1, my2;
    if (iw >= ih) {
      my1 = my2 = iy + Math.round(ih / 2); mx1 = ix + hip; mx2 = ix + iw - hip;
    } else {
      mx1 = mx2 = ix + Math.round(iw / 2); my1 = iy + hip; my2 = iy + ih - hip;
    }
    function face(pts, colour) {
      ctx.fillStyle = colour;
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.closePath();
      ctx.fill();
    }
    face([ix, iy, ix + iw, iy, mx2, my1, mx1, my1], pal.light);              // north
    face([ix, iy + ih, ix + iw, iy + ih, mx2, my2, mx1, my2], pal.dark);     // south
    face([ix, iy, mx1, my1, mx1, my2, ix, iy + ih], pal.mid);                // west
    face([ix + iw, iy, mx2, my1, mx2, my2, ix + iw, iy + ih], pal.deep);     // east

    ctx.save();
    ctx.translate(ix, iy);
    ctx.fillStyle = this.shingles(r);
    ctx.fillRect(0, 0, iw, ih);
    ctx.restore();

    ctx.strokeStyle = pal.ridge;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(mx1, my1); ctx.lineTo(mx2, my2);
    ctx.moveTo(ix, iy); ctx.lineTo(mx1, my1);
    ctx.moveTo(ix + iw, iy); ctx.lineTo(mx2, my1);
    ctx.moveTo(ix, iy + ih); ctx.lineTo(mx1, my2);
    ctx.moveTo(ix + iw, iy + ih); ctx.lineTo(mx2, my2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(x, y + h - D.EAVE, w, D.EAVE);
    ctx.fillRect(x + w - D.EAVE, y, D.EAVE, h);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(x, y, w, 2);

    this.drawChimney(r, mx1 + Math.round((mx2 - mx1) * 0.3),
                     my1 + Math.round((my2 - my1) * 0.3));
    this.drawDoorway(r, map, b, cam, pal);
    if (pal.sign) this.drawSign(r, b, cam, pal);
  },

  shingles: function (r) {

  drawChimney: function (r, cx, cy) {

    ctx.fillStyle = '#7c4838';                       // brick
    ctx.fillRect(left, top, cw, ch);
    ctx.fillStyle = '#96604c';                       // the lit face
    ctx.fillRect(left, top, 5, ch);
    ctx.fillStyle = '#5c342a';                       // two courses of mortar
    ctx.fillRect(left, top + 8, cw, 2);
    ctx.fillRect(left, top + 17, cw, 2);
    ctx.fillStyle = '#3d2b23';                       // the pot on top
    ctx.fillRect(left - 2, top - 6, cw + 4, 7);
    ctx.fillStyle = '#120e0c';                       // and down inside it
    ctx.fillRect(left + 3, top - 4, cw - 6, 4);

  doorLeaf: function (ctx, surround) {

    ctx.fillRect(-13, 13, 26, 2);
    ctx.fillStyle = surround;                    // the door surround
    ctx.fillRect(-12, -17, 24, 27);
    ctx.fillStyle = S.doorFrame;
    ctx.fillRect(-10, -15, 20, 24);
    ctx.fillStyle = S.door;                      // the door itself
    ctx.fillRect(-8, -13, 16, 21);
    ctx.fillStyle = S.doorPanel;                 // two panels, so it is a door
    ctx.fillRect(-5, -10, 10, 8);

  drawDoorway: function (r, map, b, cam, pal) {

    var px = (b.doorX - cam.x) * T, py = (b.doorY - cam.y) * T;

  drawSign: function (r, b, cam, pal) {

      ctx.fillStyle = '#5a3a20';

      ctx.fillRect(9, 14, 3, 9);                 // foot

      ctx.fillStyle = '#f2efe4';                 // mattress and pillow
      ctx.fillRect(-8, 13, 17, 6);
      ctx.fillStyle = '#b5432f';                 // blanket over most of it
      ctx.fillRect(-3, 13, 12, 6);

      c.fillRect(3, 5, 2, 2); c.fillRect(15, 2, 3, 1);
      c.fillRect(9, 17, 2, 2); c.fillRect(20, 12, 1, 3);

      c.fillRect(6, 12, 3, 1); c.fillRect(18, 20, 2, 2); c.fillRect(12, 8, 1, 2);

  drawRoomTile: function (r, map, wx, wy, px, py, pal) {
    var ctx = r.ctx, T = NG.C.TILE;
    var wall = map.tiles[NG.world.idx(map, wx, wy)] === NG.interiors.WALL;

    if (wall) {
      ctx.fillStyle = pal.wall;

      if (this.isFloor(map, wx, wy + 1)) ctx.fillRect(px, py + T - 4, T, 4);
      if (this.isFloor(map, wx - 1, wy)) ctx.fillRect(px, py, 4, T);
      if (this.isFloor(map, wx + 1, wy)) ctx.fillRect(px + T - 4, py, 4, T);
      if (this.isFloor(map, wx, wy - 1)) ctx.fillRect(px, py, T, 3);
      return;
    }

    ctx.fillStyle = pal.floor;
    ctx.fillRect(px, py, T, T);
    ctx.fillStyle = pal.plank;                       // alternating boards
    ctx.fillRect(px, py + 8, T, 8);
    ctx.fillRect(px, py + 24, T, 8);
    ctx.fillStyle = pal.groove;                      // the gaps between them
    ctx.fillRect(px, py + 7, T, 1);
    ctx.fillRect(px, py + 15, T, 1);
    ctx.fillRect(px, py + 23, T, 1);
    ctx.fillRect(px, py + 31, T, 1);
    var n = this.noise(wx, wy);
    if (n > 0.45) ctx.fillRect(px + Math.floor(n * 26) + 2, py + 8 * ((n * 4) | 0), 1, 8);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    if (!this.isFloor(map, wx, wy - 1)) ctx.fillRect(px, py, T, 5);
    if (!this.isFloor(map, wx - 1, wy)) ctx.fillRect(px, py, 4, T);
  },

  isFloor: function (map, x, y) {
    if (!NG.grid.inBounds(map, x, y)) return false;
    return map.tiles[NG.world.idx(map, x, y)] !== NG.interiors.WALL;
  },

  drawRoomExit: function (r, map, cam, pal) {
    var e = map.exit;
    if (!e) return;
    var ctx = r.ctx, T = NG.C.TILE;
    var out = { dx: 0, dy: 1 };
    if (e.y === 0) out = { dx: 0, dy: -1 };
    else if (e.y === map.height - 1) out = { dx: 0, dy: 1 };
    else if (e.x === 0) out = { dx: -1, dy: 0 };
    else if (e.x === map.width - 1) out = { dx: 1, dy: 0 };

    var px = (e.x - cam.x) * T, py = (e.y - cam.y) * T;
    ctx.fillStyle = pal.wallEdge;                 // the gap it stands in
    ctx.fillRect(px, py, T, T);
    ctx.save();
    ctx.translate(px + T / 2, py + T / 2);
    this.facing(ctx, out);
    this.doorLeaf(ctx, pal.wallEdge);
    ctx.restore();
  },


  drawProps: function (r, map, cam, tilesX, tilesY) {
    var props = map.props;
    if (!props || !props.length) return;
    var ctx = r.ctx, T = NG.C.TILE;
    for (var i = 0; i < props.length; i++) {
      var p = props[i], w = p.w || 1, h = p.h || 1;
      if (p.x + w <= cam.x || p.y + h <= cam.y) continue;
      if (p.x >= cam.x + tilesX || p.y >= cam.y + tilesY) continue;
      var def = NG.furniture.get(p.kind);
      if (!def) continue;
      var n = def.palettes.length;
      var pi = Math.floor(p.palette || 0) % n;
      if (pi < 0) pi += n;
      var img = this.sprite(r, 'f:' + p.kind + ':' + pi, def.rows, def.palettes[pi]);
      ctx.drawImage(img, (p.x - cam.x) * T, (p.y - cam.y) * T, w * T, h * T);
    }
  },


  npcPalette: function (who) {
    var t = who && this.TOWNSFOLK[who.id];
    if (t) {
      return { S: t.skin, H: t.hair, T: t.top, L: t.legs, O: '#1b1b23', A: t.accent };
    }
    var list = NG.sprites.PALETTES, n = list.length;
    var i = Math.floor((who && who.palette) || 0) % n;
    if (i < 0) i += n;
    return NG.sprites.paletteFrom(list[i]);
  },


  animTrack: function (r, key, x, y) {
    if (!r.tracks) r.tracks = {};
    var now = this.animNow(r);
    var t = r.tracks[key];
    if (!t) {
      t = { x: x, y: y, movedAt: -100000 };
      r.tracks[key] = t;
    } else if (t.x !== x || t.y !== y) {
      t.x = x; t.y = y;
      t.movedAt = now;
    }
    var walking = (now - t.movedAt) < NG.C.WALK_HOLD_MS;
    return { clip: walking ? 'walk' : 'idle', t: now, walking: walking };
  },

  animNow: function (r) {
    if (r && typeof r.nowMs === 'number' && isFinite(r.nowMs)) return r.nowMs;
    if (typeof NG.render.clockOverride === 'number' &&
        isFinite(NG.render.clockOverride)) return NG.render.clockOverride;
    return Date.now();
  },
  personSprite: function (r, shape, palette) {
    return this.sprite(r, 'human' + shape + '|' + this.paletteKey(palette),
                       NG.sprites.SHAPES[shape], palette);
  },


  playerSprite: function (r, human, track) {
    var actor = NG.animation.playerActor(human.shape);
    if (actor) {
      var shot = NG.animation.sample(actor, track ? track.clip : 'idle', track ? track.t : 0);
      if (shot) {
        return this.sprite(r, 'humanA' + human.shape + '|' + shot.id + '|' +
                           this.paletteKey(human.palette), shot.rows, human.palette);
      }
    }
    return this.personSprite(r, human.shape, human.palette);
  },
  npcSprite: function (r, who, track) {
    var body = (who && who.body) || 'human';
    var palette = this.npcPalette(who);
    if (body === 'human') {
      var actor = NG.animation.playerActor(who ? who.shape : 0);
      if (actor) {
        var shot = NG.animation.sample(actor, track ? track.clip : 'idle',
                                       track ? track.t : 0);
        if (shot) {
          return this.sprite(r, 'npcA' + (who ? who.shape : 0) + '|' + shot.id + '|' +
                             this.paletteKey(palette), shot.rows, palette);
        }
      }
      return this.personSprite(r, who ? who.shape : 0, palette);
    }
    return this.sprite(r, 'npc' + body + '|' + this.paletteKey(palette),
                       NG.sprites.rowsFor(body, 0), palette);
  },

  npcsToDraw: function (state, map, cam, tilesX, tilesY) {
    var out = [];
    if (!NG.npcs || !map || !map.id) return out;
    var clock = state ? state.clock : null;
    var here = NG.npcs.onMap(map.id);
    for (var i = 0; i < here.length; i++) {
      var who = here[i];
      var spot = NG.npcs.spotOf(clock, who);
      if (!spot || spot.mapId !== map.id) continue;
      if (spot.x < cam.x || spot.y < cam.y) continue;
      if (spot.x >= cam.x + tilesX || spot.y >= cam.y + tilesY) continue;
      out.push({ who: who, x: spot.x, y: spot.y });
    }
    return out;
  },

  petsToDraw: function (map, party) {
    var alive = [];
    for (var i = 0; i < party.length; i++) if (!party[i].lost) alive.push(party[i]);
    return this.isInterior(map) ? alive.slice(0, 1) : alive;
  },

  drawFade: function (r, state) {
    var a = NG.travel.fadeAlpha(state);
    if (a <= 0) return;
    r.ctx.fillStyle = 'rgba(0, 0, 0, ' + a + ')';
    r.ctx.fillRect(0, 0, r.canvas.width, r.canvas.height);
  },


  draw: function (r, state) {
    var ctx = r.ctx, T = NG.C.TILE, cv = r.canvas, map = state.world;
    var cam = this.camera(state, cv.width, cv.height);
    var tilesX = this.tileCount(cv.width), tilesY = this.tileCount(cv.height);
    var indoors = this.isInterior(map);
    var roomPal = indoors ? this.roomPalette(map) : null;
    var i, o, tx, ty, wx, wy, px, py;

    if (indoors) this.drawSurround(r, map, cam);
    var blocks = indoors ? null : this.blocksIn(map, cam, tilesX, tilesY);

    for (ty = 0; ty < tilesY; ty++) {
      for (tx = 0; tx < tilesX; tx++) {
        wx = cam.x + tx; wy = cam.y + ty;
        px = tx * T; py = ty * T;
        if (!NG.grid.inBounds(map, wx, wy)) {
          if (!indoors) { ctx.fillStyle = this.SKIN.void; ctx.fillRect(px, py, T, T); }
          continue;
        }
        if (indoors) this.drawRoomTile(r, map, wx, wy, px, py, roomPal);
        else this.drawGroundTile(r, map, wx, wy, px, py,
                                 blocks.owner[ty * tilesX + tx],
                                 blocks.covered[ty * tilesX + tx] === 1);
      }
    }

    if (indoors) {
      this.drawRoomExit(r, map, cam, roomPal);
    } else {
      var buildings = map.buildings || [];
      for (i = 0; i < buildings.length; i++) {
        var b = buildings[i];
        if (b.x2 < cam.x || b.y2 < cam.y) continue;
        if (b.x1 >= cam.x + tilesX || b.y1 >= cam.y + tilesY) continue;
        this.drawBuilding(r, map, b, cam);
      }
    }

    this.drawProps(r, map, cam, tilesX, tilesY);

    ctx.fillStyle = this.SKIN.coin;
    for (i = 0; i < map.coins.length; i++) {
      var c = map.coins[i];
      if (c.taken) continue;
      if (c.x < cam.x || c.y < cam.y || c.x >= cam.x + tilesX || c.y >= cam.y + tilesY) continue;
      this.drawCoin(r, c, (c.x - cam.x) * T, (c.y - cam.y) * T);
    }

    var eggsHere = map.eggs || [];
    for (i = 0; i < eggsHere.length; i++) {
      var lying = eggsHere[i];
      if (!lying || lying.taken) continue;
      var kind = NG.pets.speciesOf(lying).id;
      o = this.sprite(r, 'egg:' + kind, NG.pets.eggRowsOf(lying), NG.pets.eggPaletteOf(lying));
      ctx.drawImage(o, (lying.x - cam.x) * T, (lying.y - cam.y) * T);
    }

    var bird = map.robin;
    if (bird && !bird.beaten &&
        bird.x >= cam.x && bird.y >= cam.y &&
        bird.x < cam.x + tilesX && bird.y < cam.y + tilesY) {
      o = this.sprite(r, 'robin', NG.sprites.ROBIN, NG.sprites.robinPalette());
      ctx.drawImage(o, (bird.x - cam.x) * T, (bird.y - cam.y) * T);
    }

    var sp = map.signpost;
    if (sp && sp.x >= cam.x && sp.y >= cam.y && sp.x < cam.x + tilesX && sp.y < cam.y + tilesY) {
      var sx = (sp.x - cam.x) * T, sy = (sp.y - cam.y) * T;
      ctx.fillStyle = this.SKIN.signPost;
      ctx.fillRect(sx + 14, sy + 12, 4, 18);          // post
      ctx.fillStyle = this.SKIN.signBoard;
      ctx.fillRect(sx + 4, sy + 6, 24, 10);           // board
      ctx.fillStyle = this.SKIN.signInk;
      ctx.fillRect(sx + 7, sy + 10, 14, 2);           // lettering
    }

    var people = this.npcsToDraw(state, map, cam, tilesX, tilesY);
    for (i = 0; i < people.length; i++) {
      var whoKey = 'npc:' + map.id + ':' + (people[i].who.name || i);
      var whoAt = this.animTrack(r, whoKey, people[i].x, people[i].y);
      o = this.npcSprite(r, people[i].who, whoAt);
      ctx.drawImage(o, (people[i].x - cam.x) * T, (people[i].y - cam.y) * T);
    }

    var pets = this.petsToDraw(map, state.party);
    for (i = 0; i < pets.length; i++) {
      var down = pets[i].hp <= 0;
      var petKey = 'pet' + i + ':' + NG.pets.speciesOf(pets[i]).id;
      var petAt = down ? { clip: 'rest', t: 0 }
                       : this.animTrack(r, petKey, pets[i].x, pets[i].y);
      var art = NG.pets.poseOf(pets[i], petAt.clip, petAt.t);
      o = this.sprite(r, 'pet' + NG.pets.speciesOf(pets[i]).id + '|' + art.frameId +
                      '|' + this.paletteKey(art.palette), art.rows, art.palette);
      ctx.globalAlpha = down ? 0.45 : 1;
      ctx.drawImage(o, (pets[i].x - cam.x) * T + art.offset[0] * 2,
                       (pets[i].y - cam.y) * T + art.offset[1] * 2);
      ctx.globalAlpha = 1;
    }

    var humanAt = this.animTrack(r, 'human', state.human.x, state.human.y);
    o = this.playerSprite(r, state.human, humanAt);
    ctx.drawImage(o, (state.human.x - cam.x) * T, (state.human.y - cam.y) * T);

    var alpha = this.nightAlpha(state.clock);
    if (alpha > 0) {
      ctx.fillStyle = 'rgba(' + this.SKIN.night + ', ' + alpha + ')';
      ctx.fillRect(0, 0, cv.width, cv.height);
    }

    this.drawFade(r, state);
  }
};

NG.ambient = {

  EXCHANGES: [
    { a: 'foodstall', b: 'petfoodstall', lines: [
      'Bo. Your pet biscuits smell better than my bread this morning.',

    ] },

    { a: 'jeweller', b: 'ounce', lines: [

    ] },

    { a: 'wellkeeper', b: 'innporter', lines: [

    ] },

    { a: 'bucketman', b: 'wellkeeper', lines: [
      'Sabel. That is the third handle this month.',

    ] },

    { a: 'vetwaiter', b: 'sweeper', lines: [
      'Nab. There is a whole loaf of crumbs by the gear stall.',

    ] },

    { a: 'innporter', b: 'petfoodstall', lines: [
      'Bo. Has a cart come past you this morning?',
      'Three of them. Not one stopped. Not one of them ever stops.'
    ] }
  ],

  stateOf: function (state) {
    if (!state.ambient) {
      state.ambient = { wait: NG.C.AMBIENT.GAP_MIN, show: null, next: 0, age: 0, ran: {} };
    }
    return state.ambient;
  },

  since: function (st, i) {
    if (!st.ran || !Object.prototype.hasOwnProperty.call(st.ran, i)) return null;
    return st.age - st.ran[i];
  },

  busy: function (state) {
    if (!state) return true;
    if (state.gameOver) return true;
    if (state.convo || state.shop || state.bagOpen || state.asking) return true;
    if (NG.travel && NG.travel.isBusy(state)) return true;
    return false;
  },

  onScreen: function (state, spot) {
    if (!state || !state.world || !spot) return false;
    if (spot.mapId !== state.world.id) return false;
    var size = NG.screenSize(state.screenSize);
    var cam = NG.render.camera(state, size.w, size.h);
    var tilesX = NG.render.tileCount(size.w), tilesY = NG.render.tileCount(size.h);
    return spot.x >= cam.x && spot.y >= cam.y &&
           spot.x < cam.x + tilesX && spot.y < cam.y + tilesY;
  },

  near: function (a, b) {
    if (!a || !b || a.mapId !== b.mapId) return false;
    return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)) <= NG.C.AMBIENT.NEAR;
  },

  speakerFor: function (state, id) {
    if (!state || !state.world) return null;
    var who = NG.npcs.get(id);
    if (!who) return null;
    var clock = state.clock || null;
    var spot = NG.npcs.spotOf(clock, who);
    if (!spot) return null;
    if (NG.npcs.atSpot(clock, spot.mapId, spot.x, spot.y) !== who) return null;
    if (!this.onScreen(state, spot)) return null;
    return spot;
  },

  canRun: function (state, ex) {
    if (!ex) return null;
    var a = this.speakerFor(state, ex.a);
    if (!a) return null;
    var b = this.speakerFor(state, ex.b);
    if (!b) return null;
    if (!this.near(a, b)) return null;
    return { a: a, b: b };
  },

  start: function (state) {
    var st = this.stateOf(state);
    var n = this.EXCHANGES.length;
    for (var k = 0; k < n; k++) {
      var i = (st.next + k) % n;
      var since = this.since(st, i);
      if (since !== null && since < NG.C.AMBIENT.REPEAT_MIN) continue;
      if (!this.canRun(state, this.EXCHANGES[i])) continue;
      st.next = (i + 1) % n;
      st.ran[i] = st.age;
      st.show = { ex: i, line: 0, left: NG.C.AMBIENT.LINE_MIN };
      return true;
    }
    return false;
  },

  tick: function (state, gameMinutes) {
    if (!state) return null;
    var st = this.stateOf(state);
    if (typeof gameMinutes !== 'number' || !isFinite(gameMinutes) || gameMinutes < 0) {
      gameMinutes = 0;
    }
    st.age += gameMinutes;

    if (this.busy(state)) {
      st.show = null;
      st.wait = NG.C.AMBIENT.GAP_MIN;
      this.paint(state);
      return st;
    }

    if (st.show) {
      var ex = this.EXCHANGES[st.show.ex];
      if (!ex || !this.canRun(state, ex)) {
        st.show = null;
        st.wait = NG.C.AMBIENT.GAP_MIN;
      } else {
        st.show.left -= gameMinutes;
        if (st.show.left <= 0) {
          st.show.line += 1;
          if (st.show.line >= ex.lines.length) {
            st.show = null;
            st.wait = NG.C.AMBIENT.GAP_MIN;
          } else {
            st.show.left = NG.C.AMBIENT.LINE_MIN;
          }
        }
      }
    } else {
      st.wait -= gameMinutes;
      if (st.wait <= 0 && !this.start(state)) st.wait = NG.C.AMBIENT.RETRY_MIN;
    }

    this.paint(state);
    return st;
  },

  showing: function (state) {
    var st = state ? state.ambient : null;
    if (!st || !st.show) return null;
    var ex = this.EXCHANGES[st.show.ex];
    if (!ex || st.show.line >= ex.lines.length) return null;
    var id = (st.show.line % 2 === 0) ? ex.a : ex.b;
    var who = NG.npcs.get(id);
    if (!who) return null;
    var spot = NG.npcs.spotOf(state.clock || null, who);
    if (!spot) return null;
    return {
      id: id, name: who.name, text: ex.lines[st.show.line],
      mapId: spot.mapId, x: spot.x, y: spot.y
    };
  },

  paint: function (state) {
    if (state && state.ui && typeof state.ui.ambient === 'function') state.ui.ambient();
  }
};

/* ---- src/input.js ---- */
NG.input = {
  MAP: {
    ArrowUp: { dx: 0, dy: -1 }, ArrowDown:  { dx: 0, dy: 1 },
    ArrowLeft: { dx: -1, dy: 0 }, ArrowRight: { dx: 1, dy: 0 },
    w: { dx: 0, dy: -1 }, s: { dx: 0, dy: 1 }, a: { dx: -1, dy: 0 }, d: { dx: 1, dy: 0 }
  },

  keyToDirection: function (held) {
    var dx = 0, dy = 0, any = false;
    for (var key in held) {
      if (!held[key]) continue;
      var k = (key.length === 1) ? key.toLowerCase() : key;
      var m = this.MAP[k];
      if (!m) continue;
      dx += m.dx; dy += m.dy; any = true;
    }
    if (!any) return null;
    dx = Math.max(-1, Math.min(1, dx));
    dy = Math.max(-1, Math.min(1, dy));
    if (dx === 0 && dy === 0) return null;
    return { dx: dx, dy: dy };
  },

  create: function () {
    var self = this;
    var input = {
      held: {},       // keyboard keys currently down
      touch: null,    // most-recently-pressed pad direction that's still held, or null
      touchHeld: {},  // pad button id -> {dx, dy}, for buttons currently down
      touchOrder: [], // pad button ids in the order they were pressed, oldest first
      tap: null       // a pad press that has not been walked yet; see stepDirection
    };

    input.direction = function () {
      if (input.touch) return input.touch;
      return self.keyToDirection(input.held);
    };

    input.stepThisFrame = function (ready) {
      if (!ready) return null;
      var dir = input.direction() || input.tap;
      input.tap = null;
      return dir;
    };

    input.pressTouch = function (id, dir) {
      var order = input.touchOrder;
      var idx = order.indexOf(id);
      if (idx !== -1) order.splice(idx, 1);
      order.push(id);
      input.touchHeld[id] = dir;
      input.touch = dir;
      input.tap = dir;
    };
    input.releaseTouch = function (id) {
      delete input.touchHeld[id];
      var order = input.touchOrder;
      var idx = order.indexOf(id);
      if (idx !== -1) order.splice(idx, 1);
      input.touch = order.length ? input.touchHeld[order[order.length - 1]] : null;
    };
    input.clearTouch = function () {
      input.touchHeld = {};
      input.touchOrder = [];
      input.touch = null;
    };
    input.clearAll = function () {
      input.held = {};
      input.tap = null;
      input.clearTouch();
    };

    return input;
  },

  attach: function (input, target) {
    function onKeyDown(e) {
      input.held[e.key] = true;
      if (NG.input.MAP[e.key] || NG.input.MAP[(e.key || '').toLowerCase()]) e.preventDefault();
    }
    function onKeyUp(e) { delete input.held[e.key]; }
    function onHidden() { if (document.hidden) input.clearAll(); }

    target.addEventListener('keydown', onKeyDown);
    target.addEventListener('keyup', onKeyUp);

    window.addEventListener('blur', input.clearAll);
    document.addEventListener('visibilitychange', onHidden);

    return function detach() {
      target.removeEventListener('keydown', onKeyDown);
      target.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('blur', input.clearAll);
      document.removeEventListener('visibilitychange', onHidden);
    };
  },

  makeTouchPad: function (input) {
    var pad = document.createElement('div');
    pad.className = 'touchpad';
    var layout = [
      ['nw', -1, -1], ['n', 0, -1], ['ne', 1, -1],
      ['w', -1, 0],                 ['e', 1, 0],
      ['sw', -1, 1], ['s', 0, 1],   ['se', 1, 1]
    ];

    function releaseElsewhere(e) {
      if (!pad.contains(e.target)) input.clearTouch();
    }
    document.addEventListener('mouseup', releaseElsewhere);
    document.addEventListener('touchend', releaseElsewhere);
    document.addEventListener('touchcancel', releaseElsewhere);

    pad.ngDetach = function () {
      document.removeEventListener('mouseup', releaseElsewhere);
      document.removeEventListener('touchend', releaseElsewhere);
      document.removeEventListener('touchcancel', releaseElsewhere);
    };

    for (var i = 0; i < layout.length; i++) {
      (function (item) {
        var id = item[0];
        var dir = { dx: item[1], dy: item[2] };
        var b = document.createElement('button');
        b.setAttribute('data-dir', id);
        b.textContent = id.toUpperCase();
        function press(e) { e.preventDefault(); input.pressTouch(id, dir); }
        function release(e) { e.preventDefault(); input.releaseTouch(id); }
        b.addEventListener('touchstart', press);
        b.addEventListener('mousedown', press);
        b.addEventListener('touchend', release);
        b.addEventListener('touchcancel', release);
        b.addEventListener('mouseup', release);
        b.addEventListener('mouseleave', release);
        pad.appendChild(b);
      })(layout[i]);
    }
    return pad;
  }
};

/* ---- src/audio.js ---- */
NG.audio = {
  ctx: null,
  enabled: true,
  musicEnabled: true,
  music: null,
  musicKey: null,
  musicWanted: null,
  musicAttempted: false,
  musicStore: null,

  trackFor: function (state) {
    var id = state && state.world && state.world.id;
    return state && !state.gameOver && (id === 'forest' || id === 'town') ? id : null;
  },

  stopMusic: function () {
    if (this.music) { try { this.music.pause(); } catch (e) {} }
    this.music = null;
    this.musicKey = null;
    this.musicAttempted = false;
  },

  updateMusic: function (state, hidden) {
    this.musicWanted = this.trackFor(state);
    var key = this.musicEnabled && !hidden ? this.musicWanted : null;
    if (key !== this.musicKey) {
      this.stopMusic();
      if (key) {
        try {
          this.music = new window.Audio(NG.musicData[key]);
          this.music.loop = true;
          this.music.volume = 0.30;
          this.musicKey = key;
        } catch (e) { this.stopMusic(); return; }
      }
    }
    if (!this.music || this.musicAttempted) return;
    this.musicAttempted = true;
    try {
      var result = this.music.play();
      if (result && result.catch) result.catch(function () {});
    } catch (e) { /* unsupported audio must never interrupt a game */ }
  },

  setMusicEnabled: function (enabled) {
    this.musicEnabled = !!enabled;
    try {
      if (this.musicStore) this.musicStore.setItem('nineange.music', enabled ? 'on' : 'off');
    } catch (e) {}
    if (!this.musicEnabled) this.stopMusic();
  },

  bindMusic: function (stateNow, button, host, page, storage) {
    var self = this;
    self.musicStore = storage;
    try { if (storage) self.musicEnabled = storage.getItem('nineange.music') !== 'off'; }
    catch (e) { /* keep the in-memory preference when storage is unavailable */ }
    function update() { self.updateMusic(stateNow(), !!page.hidden); }
    function label() {
      button.textContent = self.musicEnabled ? 'Music: on' : 'Music: off';
      button.setAttribute('aria-pressed', self.musicEnabled ? 'true' : 'false');
    }
    function unlock() {
      if (self.music && self.music.paused) self.musicAttempted = false;
      update();
    }
    function toggle() {
      self.setMusicEnabled(!self.musicEnabled);
      label(); update();
    }
    button.addEventListener('click', toggle);
    host.addEventListener('pointerdown', unlock);
    host.addEventListener('keydown', unlock);
    page.addEventListener('visibilitychange', update);
    label(); update();
    return function () {
      button.removeEventListener('click', toggle);
      host.removeEventListener('pointerdown', unlock);
      host.removeEventListener('keydown', unlock);
      page.removeEventListener('visibilitychange', update);
      self.stopMusic();
      self.musicWanted = null;
    };
  },

  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch (e) { this.enabled = false; }
  },

  TONES: {
    coin:      { freq: 880,  to: 1320, dur: 0.10, type: 'square'   },
    pick:      { freq: 440,  to: 560,  dur: 0.08, type: 'triangle' },
    drink:     { freq: 320,  to: 220,  dur: 0.16, type: 'sine'     },
    hatch:     { freq: 330,  to: 990,  dur: 0.60, type: 'triangle' },
    milestone: { freq: 520,  to: 1040, dur: 0.35, type: 'square'   },
    warning:   { freq: 220,  to: 160,  dur: 0.40, type: 'sawtooth' }
  },

  play: function (name) {
    if (!this.enabled) return;
    try {
      if (!this.ctx) this.init();
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      var t = this.TONES[name];
      if (!t) return;
      var now = this.ctx.currentTime;
      var osc = this.ctx.createOscillator();
      var gain = this.ctx.createGain();
      osc.type = t.type;
      osc.frequency.setValueAtTime(t.freq, now);
      osc.frequency.linearRampToValueAtTime(t.to, now + t.dur);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t.dur);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now); osc.stop(now + t.dur);
    } catch (e) { /* sound must never break the game */ }
  }
};

/* ---- src/ui.js ---- */
var NG = NG || {};

NG.ui = {


  _button: function (label, dataAttr, onClick, extraClass) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ng-btn' + (extraClass ? ' ' + extraClass : '');
    btn.setAttribute(dataAttr, '');
    btn.textContent = label;
    btn.addEventListener('click', function () {
      if (typeof onClick === 'function') onClick();
    });
    return btn;
  },

  _bar: function (label, value, max) {
    if (typeof value !== 'number' || !isFinite(value)) value = 0;
    if (typeof max !== 'number' || !isFinite(max) || max <= 0) max = 100;
    var v = Math.max(0, Math.min(max, Math.round(value)));
    var pct = Math.max(0, Math.min(100, Math.round(v * 100 / max)));
    var level = pct <= 20 ? 'ng-bar-low' : (pct <= 50 ? 'ng-bar-mid' : 'ng-bar-high');
    var row = document.createElement('div');
    row.className = 'ng-bar-row';
    var lab = document.createElement('div');

  characterCreator: function (container, onDone, onResume) {
    var SHAPE_NAMES = ['Tall', 'Strong', 'Braids', 'Hat'];
    var picked = { shape: 0, paletteIndex: 0 };
    var shapeCards = [];   // { button, preview } per shape, in shape order
    var paletteButtons = []; // per palette, in palette order

    container.innerHTML = '';

    var heading = document.createElement('h1');

    var CHIP_ORDER = ['skin', 'hair', 'top', 'legs'];
    for (p = 0; p < NG.sprites.PALETTES.length; p++) {
      var choice = NG.sprites.PALETTES[p];
      var paletteBtn = document.createElement('button');
      paletteBtn.type = 'button';
      paletteBtn.className = 'ng-palette-card';
      paletteBtn.setAttribute('data-palette', p);

      var chips = document.createElement('div');
      chips.className = 'ng-palette-chips';
      for (var c = 0; c < CHIP_ORDER.length; c++) {
        var chip = document.createElement('span');
        chip.className = 'ng-palette-chip';
        chip.style.background = choice[CHIP_ORDER[c]];
        chips.appendChild(chip);
      }
      paletteBtn.appendChild(chips);

      var paletteName = document.createElement('span');
      paletteName.className = 'ng-card-name';
      paletteName.textContent = choice.name;
      paletteBtn.appendChild(paletteName);

      (function (idx) {
        paletteBtn.addEventListener('click', function () {
          picked.paletteIndex = idx;
          redraw();
        });
      })(p);

      paletteRow.appendChild(paletteBtn);
      paletteButtons.push(paletteBtn);
    }

    var nameSection = document.createElement('div');
    nameSection.className = 'ng-creator-section';
    var nameLabel = document.createElement('label');
    nameLabel.className = 'ng-creator-label';
    nameLabel.textContent = "What's your name?";
    var nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'ng-name-input';
    nameInput.maxLength = 18;
    nameInput.value = 'Explorer';
    nameLabel.appendChild(nameInput);
    nameSection.appendChild(nameLabel);
    container.appendChild(nameSection);

    if (typeof onResume === 'function') {
      var resumeSection = document.createElement('div');
      resumeSection.className = 'ng-creator-section ng-creator-resume';
      var resumeLabel = document.createElement('div');
      resumeLabel.className = 'ng-creator-label';
      resumeLabel.textContent = 'Been here before?';

      resumeSection.appendChild(NG.ui._button('Carry on where you left off', 'data-resume',

    var startBtn = NG.ui._button("Let's go!", 'data-start', function () {
      var palette = NG.sprites.paletteFrom(NG.sprites.PALETTES[picked.paletteIndex]);
      var name = nameInput.value.trim() || 'Explorer';
      onDone({ shape: picked.shape, palette: palette, name: name });

    function redraw() {
      var palette = NG.sprites.paletteFrom(NG.sprites.PALETTES[picked.paletteIndex]);
      for (var si = 0; si < shapeCards.length; si++) {
        var entry = shapeCards[si];
        entry.preview.innerHTML = '';
        entry.preview.appendChild(NG.sprites.toCanvas(NG.sprites.SHAPES[si], palette, 4));
        if (si === picked.shape) entry.button.classList.add('ng-selected');
        else entry.button.classList.remove('ng-selected');
      }
      for (var pi = 0; pi < paletteButtons.length; pi++) {
        if (pi === picked.paletteIndex) paletteButtons[pi].classList.add('ng-selected');
        else paletteButtons[pi].classList.remove('ng-selected');
      }
    }

    redraw();
  },

  hud: function (container) {
    container.innerHTML = '';
    container.className = 'ng-hud';

    function render(state) {
      container.innerHTML = '';
      var party = state.party || [];
      var i;

      var downed = [];
      for (i = 0; i < party.length; i++) {
        var candidate = party[i];
        if (candidate.lost || candidate.hp > 0) continue;
        downed.push(candidate);
      }
      if (downed.length) {
        var warnings = document.createElement('div');
        warnings.className = 'ng-hud-warnings';
        for (i = 0; i < downed.length; i++) {
          var pet = downed[i];
          var downedAt = (pet.downedAtStep === null || pet.downedAtStep === undefined)
            ? state.steps : pet.downedAtStep;
          var since = state.steps - downedAt;
          var hasCount = typeof since === 'number' && isFinite(since);
          var remaining = hasCount
            ? Math.max(0, Math.min(NG.C.DOWNED_STEPS, NG.C.DOWNED_STEPS - since))
            : null;
          var line = document.createElement('div');
          line.className = 'ng-hud-warning';
          var warningText = NG.pets.nameOfCap(pet) + ' is hurt and needs help!';
          if (hasCount) warningText += ' Only ' + remaining + ' steps left to save it!';
          line.textContent = warningText;
          warnings.appendChild(line);
        }
        container.appendChild(warnings);
      }

      var top = document.createElement('div');
      top.className = 'ng-hud-top';

      var clockChip = document.createElement('div');
      clockChip.className = 'ng-hud-chip';
      clockChip.textContent = 'Day ' + state.clock.day + ' • ' + NG.clock.label(state.clock);
      top.appendChild(clockChip);

      var walletChip = document.createElement('div');
      walletChip.className = 'ng-hud-chip';
      walletChip.textContent = 'Coins ' + state.coins + '   Berries ' + state.berries;
      top.appendChild(walletChip);

      var scoreChip = document.createElement('div');
      scoreChip.className = 'ng-hud-chip';
      scoreChip.textContent = 'Score ' + state.score.total + ' — ' + state.score.title;
      top.appendChild(scoreChip);

      container.appendChild(top);

      var eggsCarried = state.eggs || [];
      for (var eggN = 0; eggN < eggsCarried.length; eggN++) {
        var carriedEgg = eggsCarried[eggN];
        if (!carriedEgg || carriedEgg.ready) continue;
        var left = Math.max(0, NG.C.HATCH_STEPS - carriedEgg.steps);
        var eggChip = document.createElement('div');
        eggChip.className = 'ng-hud-chip ng-hud-egg';
        eggChip.textContent = 'Egg: ' + left + ' steps until it hatches';
        container.appendChild(eggChip);
      }

      var youCard = document.createElement('div');
      youCard.className = 'ng-hud-card';
      var youTitle = document.createElement('div');
      youTitle.className = 'ng-hud-card-title';
      youTitle.textContent = 'You';
      youCard.appendChild(youTitle);
      youCard.appendChild(NG.ui._stats(state.human));
      container.appendChild(youCard);

      for (i = 0; i < party.length; i++) {
        var member = party[i];
        if (member.lost) continue;
        var petCard = document.createElement('div');
        petCard.className = 'ng-hud-card' + (member.hp <= 0 ? ' ng-hud-card-downed' : '');
        var petTitle = document.createElement('div');
        petTitle.className = 'ng-hud-card-title';
        petTitle.textContent = NG.pets.nameOfCap(member) +
          ' — Age ' + NG.pets.ageOf(member) +
          (NG.pets.isTeen(member) ? ' (grown up)' : '') +
          ' · ATK ' + NG.fight.atkOf(member, state.worn) +
          ' · DEF ' + NG.fight.defOf(member, state.worn);
        petCard.appendChild(petTitle);
        petCard.appendChild(NG.ui._stats(member));
        container.appendChild(petCard);
      }
    }

    return { update: render };
  },

  toast: function (container, text) {

  ambientLayer: function (host) {
    var el = document.createElement('div');
    el.className = 'ng-ambient-host';
    host.appendChild(el);

    var drawn = null;

    function clear() {
      if (el.firstChild) el.innerHTML = '';
      drawn = null;
      return null;
    }

    function update(state) {
      var line = (NG.ambient && state) ? NG.ambient.showing(state) : null;
      if (!line) return clear();

      var size = NG.screenSize(state.screenSize);
      var cam = NG.render.camera(state, size.w, size.h);
      var T = NG.C.TILE;
      var key = line.id + '|' + line.text;

      var bubble = el.firstChild;
      if (!bubble || drawn !== key) {
        el.innerHTML = '';
        bubble = document.createElement('div');
        bubble.className = 'ng-ambient';
        bubble.setAttribute('data-ambient', '');
        bubble.setAttribute('data-ambient-who', line.id);
        var name = document.createElement('span');
        name.className = 'ng-ambient-name';
        name.textContent = line.name;
        bubble.appendChild(name);
        var words = document.createElement('span');
        words.className = 'ng-ambient-text';
        words.textContent = line.text;
        bubble.appendChild(words);
        el.appendChild(bubble);
        drawn = key;
      }

      var px = (line.x - cam.x) * T + T / 2;
      var py = (line.y - cam.y) * T;
      var below = py < T * 2;
      bubble.className = 'ng-ambient' + (below ? ' ng-ambient-below' : '');
      bubble.style.top = ((below ? py + T : py) / size.h * 100) + '%';

      var left = px / size.w * 100;
      var stage = bubble.offsetParent;
      if (stage && stage.clientWidth > 0 && bubble.offsetWidth > 0) {
        var halfPct = (bubble.offsetWidth / 2 + 4) / stage.clientWidth * 100;
        left = (halfPct * 2 >= 100) ? 50
             : Math.max(halfPct, Math.min(100 - halfPct, left));
      }
      bubble.style.left = left + '%';
      return bubble;
    }

    return { el: el, update: update, clear: clear };
  },

  namePet: function (container, pet, onDone) {

    root.className = 'ng-confirm';
    root.setAttribute('data-namepet', '');

    var msg = document.createElement('p');
    msg.className = 'ng-confirm-text';
    msg.textContent = 'Your ' + NG.pets.kindOf(pet) + ' hatched! What will you call it?';
    root.appendChild(msg);

    var pic = document.createElement('div');
    pic.className = 'ng-namepet-pic';
    try {
      var art = NG.pets.poseOf(pet, 'rest', 0);
      pic.appendChild(NG.sprites.toCanvas(art.rows, art.palette, 3));
    } catch (e) { /* the words are enough */ }
    root.appendChild(pic);

    var field = document.createElement('input');
    field.type = 'text';
    field.className = 'ng-name-input';
    field.setAttribute('data-namepet-field', '');
    field.maxLength = 18;
    field.value = fallback;
    root.appendChild(field);

    var done = false;
    function finish(name) {
      if (done) return;
      done = true;
      if (root.parentNode) root.parentNode.removeChild(root);
      if (typeof onDone === 'function') onDone(name);
    }

    var row = document.createElement('div');
    row.className = 'ng-confirm-buttons';
    row.appendChild(NG.ui._button('That is its name', 'data-namepet-ok', function () {
      finish(field.value);
    }, 'ng-btn-primary ng-btn-util'));
    row.appendChild(NG.ui._button('Not now', 'data-namepet-skip', function () {
      finish(null);
    }, 'ng-btn-ghost ng-btn-util'));
    root.appendChild(row);

    field.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(field.value); }
    });

    container.appendChild(root);
    if (typeof field.focus === 'function') field.focus();
    if (typeof field.select === 'function') field.select();

  choosePet: function (container, pets, pick) {
    var root = document.createElement('div');
